    --bg: #ffffff;
    --bg-soft: #f4f4f4;
    --bg-hover: rgba(0, 0, 0, 0.04);
    --border: #e6e6e6;
    --text: #0a0a0a;
    --text-muted: #6b6b6b;
    --accent: #a20e0c;
    --accent-hover: #870b0a;
    --accent-soft: rgba(162, 14, 12, 0.1);
    --on-accent: #ffffff;
    --danger: #a20e0c;
    --ok: #138a4b;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --bg-soft: #141414;
    --bg-hover: rgba(255, 255, 255, 0.05);
    --border: #262626;
    --text: #ffffff;
    --text-muted: #8a8a8a;
    --accent: #e3261f;
    --accent-hover: #f0403a;
    --accent-soft: rgba(227, 38, 31, 0.16);
    --danger: #ff4a43;
    --ok: #3ccf7f;
    --shadow: 0 8px 28px rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    /* Inter para texto; Noto Color Emoji garante emojis (inclusive bandeiras) em qualquer sistema */
    font-family: "Inter", "Noto Color Emoji", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font: inherit; }
  svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: 260px minmax(0, 600px) 340px; justify-content: center; min-height: 100vh; }

  /* ---------- Logo (usada como máscara: assume a cor do tema) ---------- */
  .mark, .wordmark { display: block; background-color: currentColor; -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }
  .mark { -webkit-mask-image: var(--icon); mask-image: var(--icon); }
  .wordmark { -webkit-mask-image: var(--logo); mask-image: var(--logo); aspect-ratio: 669 / 188; }

  /* ---------- Navegação lateral ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 8px 12px; gap: 2px; }
  .logo { display: flex; align-items: center; height: 60px; padding: 0 16px; margin-bottom: 2px; border-radius: 999px; color: var(--accent); width: fit-content; }
  .logo:hover { background: var(--accent-soft); }
  .logo .wordmark { width: 140px; }
  .logo .mark { display: none; width: 30px; height: 30px; }
  .mobile-mark { display: none; color: var(--accent); width: 28px; height: 28px; margin-left: auto; }
  .nav-item { display: flex; align-items: center; gap: 18px; padding: 11px 16px; border-radius: 999px; font-size: 19px; width: fit-content; transition: background .15s; white-space: nowrap; }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { font-weight: 700; }
  .nav-item.active svg { color: var(--accent); }
  .nav-item svg { width: 26px; height: 26px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 0 20px; height: 40px; transition: background .15s, opacity .15s; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-outline { border: 1px solid var(--border); font-weight: 700; border-radius: 999px; padding: 0 18px; height: 36px; }
  .btn-outline:hover { background: var(--bg-hover); }
  .btn-outline.danger { color: var(--danger); }
  .btn-sm { height: 32px; padding: 0 14px; font-size: 14px; }
  .btn-post-big { width: 90%; height: 52px; font-size: 17px; margin-top: 12px; }
  .me-card { margin-top: auto; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 999px; text-align: left; }
  .me-card:hover { background: var(--bg-hover); }
  .me-card .names { min-width: 0; }
  .me-card .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
  .badge-dot { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }

  /* ---------- Feed ---------- */
  .feed { border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; }

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let lang = ls.get("komu:lang") || ((navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en");
  if (!I18N[lang]) lang = "pt";
  const t = (k, v = {}) => String(I18N[lang][k] ?? I18N.pt[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => (v[x] ?? ""));
  const locale = () => (lang === "pt" ? "pt-BR" : "en-US");

  /* =================================================================
     Estado
     ================================================================= */
  const state = {
    me: null,
    liked: new Set(), reposted: new Set(), bookmarked: new Set(),
    following: new Map(),            // id -> 'accepted' | 'pending'
    requests: [],                    // perfis que pediram para me seguir
    posts: [], hasMore: false, loading: false,
    view: "home", tab: "foryou", query: "",
    profileId: null, profile: null, profileReposts: [],
    replyTo: null, pending: 0,
    trends: null, suggestions: null,
    mfaPending: false,
    reported: new Set(),             // posts que eu denunciei (ficam ocultos para mim)
    notifCount: 0,
  };
  let loadSeq = 0;

  /* ---------------- Utilidades ---------------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (name = "?") => name.trim().split(/\s+/).slice(0, 2).map((p) => [...p][0]).join("").toUpperCase() || "?";
  const fmt = (n) => {
    const k = lang === "pt" ? [" mi", " mil"] : ["M", "K"];
    return n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + k[0] : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".0", "") + k[1] : n ? String(n) : "";
  };
  const cleanQuery = (s) => s.replace(/[,()%*\\"']/g, " ").trim();
  const min = 60e3, hour = 60 * min, day = 24 * hour;
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < min) return t("now");
    if (d < hour) return t("unitMin", { n: Math.floor(d / min) });
    if (d < day) return t("unitH", { n: Math.floor(d / hour) });
    return new Date(ts).toLocaleDateString(locale(), { day: "numeric", month: "short" }).replace(".", "");
  }
  function richText(text) {
    return esc(text)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a class="link" href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|\s)(#[\wÀ-ÿ]+)/g, '$1<span class="tag" data-search="$2">$2</span>')
      .replace(/(^|\s)@(\w+)/g, '$1<span class="mention" data-username="$2">@$2</span>');
  }
  function avatarInner(u) {
    return u && u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="" loading="lazy">` : esc(initials(u ? u.name : "?"));
  }
  function avatarHTML(u) {
    return `<span class="avatar" style="background:${esc((u && u.color) || "#444")}">${avatarInner(u)}</span>`;
  }

  const ICONS = {
    reply: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    repost: '<svg viewBox="0 0 24 24"><path d="M7 7h11v6M18 13l-3-3M18 13l3-3M17 17H6v-6M6 11l-3 3M6 11l3 3"/></svg>',
    like: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',

    share: '<svg viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>',
    more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
    lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    flag: '<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  };
  const lockHTML = () => `<span class="lock" title="${esc(t("privateAccount"))}" aria-label="${esc(t("privateAccount"))}">${ICONS.lock}</span>`;

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  // Traduz erros do Supabase em mensagens úteis (e mostra o detalhe técnico)
  function errMsg(base, e) {
    const m = (e && (e.message || e.error_description || e.error || e.msg)) || "";
    if (/bucket not found/i.test(m)) return t("errNoBucket");
    if ((e && (e.code === "42703" || e.code === "PGRST204" || e.code === "42P01")) || /column .* does not exist|schema cache/i.test(m)) return t("errDbOutdated");
    if (/mfa|totp|factor/i.test(m) && /disabled|not enabled/i.test(m)) return t("errMfaOff");
    return m ? `${base} (${m})` : base;
  }

  /* =================================================================
     Idioma: aplicar textos
     ================================================================= */
  function applyI18n() {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    $$("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    $$("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
    $$("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    $$("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  }
  function setLang(l) {
    if (!I18N[l] || l === lang) return;
    lang = l; ls.set("komu:lang", l);
    applyI18n();
    setAuthMode($("#authForm").dataset.mode, true);
    modal.ta.placeholder = t(state.replyTo ? "replyPh" : "whatsHappening");
    renderMe(); renderNav(); renderProfileHead(); renderTimeline();
    renderTrends(); renderFollow(); renderNewPosts(); renderNotifBadge();
    if ($("#settingsModal").classList.contains("open")) { renderRequests(); render2fa(); }
    closePicker();
  }

  /* =================================================================
     Posts
     ================================================================= */
  function postHTML(p, opts = {}) {
    const ts = Date.parse(p.created_at);
    const liked = state.liked.has(p.id), reposted = state.reposted.has(p.id), saved = state.bookmarked.has(p.id);
    const article = `
      <article class="post" data-id="${p.id}">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="clickable" data-user="${p.author_id}">${avatarHTML(p)}</div>
          ${opts.thread ? '<div class="thread-line"></div>' : ""}
        </div>
        <div class="post-body">
          <div class="post-meta">
            <span class="name clickable" data-user="${p.author_id}">${esc(p.name)}</span>
            ${p.is_private ? lockHTML() : ""}
            <span class="handle">@${esc(p.username)}</span><span>·</span>
            <time datetime="${esc(p.created_at)}" title="${esc(new Date(ts).toLocaleString(locale()))}">${timeAgo(ts)}</time>
            ${opts.compact ? "" : `<button class="post-menu" data-action="menu" aria-label="${esc(t("more"))}">${ICONS.more}</button>`}
          </div>
          ${p.reply_to_username && !opts.compact ? `<div class="replying-to">${esc(t("replyingTo"))} <b>@${esc(p.reply_to_username)}</b></div>` : ""}
          <div class="post-text">${richText(p.content)}</div>
          ${opts.compact ? "" : `
          <div class="actions">
            <button class="action reply" data-action="reply" aria-label="${esc(t("reply"))}"><span class="icon">${ICONS.reply}</span><span>${fmt(p.reply_count)}</span></button>
            <button class="action repost ${reposted ? "on" : ""}" data-action="repost" aria-label="${esc(t("repost"))}"><span class="icon">${ICONS.repost}</span><span>${fmt(p.repost_count)}</span></button>
            <button class="action like ${liked ? "on" : ""}" data-action="like" aria-label="${esc(t("like"))}"><span class="icon">${ICONS.like}</span><span>${fmt(p.like_count)}</span></button>
            <button class="action bookmark ${saved ? "on" : ""}" data-action="bookmark" aria-label="${esc(t("bookmark"))}"><span class="icon">${ICONS.bookmark}</span></button>
            <button class="action share" data-action="share" aria-label="${esc(t("share"))}"><span class="icon">${ICONS.share}</span></button>
          </div>`}
        </div>
      </article>`;
    if (opts.notif) {
      const icon = opts.notif === "reply" ? ICONS.reply : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>';
      return `<div class="post-wrap"><div class="notif-label">${icon} ${esc(t(opts.notif === "reply" ? "repliedYou" : "mentionedYou", { name: p.name }))}</div>${article}</div>`;
    }
    if (opts.repostBy) return `<div class="post-wrap"><div class="reposted-by">${ICONS.repost} ${esc(t("repostedBy", { name: opts.repostBy }))}</div>${article}</div>`;
    return article;
  }

  function renderSetup() {
    $("#timeline").innerHTML = `<div class="setup"><h2>${esc(t("setupTitle"))}</h2><p class="muted">${esc(t("setupText"))}</p></div>`;
  }

  function emptyHTML(key, withLogin) {
    return `<div class="empty"><h2>${esc(t(key + "T"))}</h2><p>${esc(t(key + "D"))}</p>${withLogin ? `<button class="btn-primary" data-open-auth>${esc(t("login"))}</button>` : ""}</div>`;
  }

  function renderTimeline() {
    const tl = $("#timeline");
    if (!sb) return renderSetup();
    const v = state.view;
    if (v === "profile") {
      if (state.profile === false) { tl.innerHTML = ""; return; }
      if (state.profile && !state.profile.canSee) {
        tl.innerHTML = `<div class="empty"><div class="big-lock">${ICONS.lock}</div><h2>${esc(t("privateTitle"))}</h2><p>${esc(t("privateText", { u: state.profile.u.username }))}</p></div>`;
        return;
      }
    }
    const banner = v === "notifications" && state.me && state.requests.length
      ? `<button class="req-banner" data-open-settings>${ICONS.lock} ${esc(state.requests.length === 1 ? t("requestsBanner1") : t("requestsBannerN", { n: state.requests.length }))}</button>` : "";
    const posts = state.posts.filter((p) => !state.reported.has(p.id));
    if (state.loading && !posts.length) { tl.innerHTML = banner + '<div class="spinner"></div>'; return; }
    if (!posts.length) {
      const needLogin = (["liked", "bookmarks", "notifications"].includes(v) || (v === "home" && state.tab === "following")) && !state.me;
      if (needLogin) { tl.innerHTML = emptyHTML("emptyLogin", true); return; }
      const key = v === "home" ? (state.tab === "following" ? "emptyFollowing" : "emptyHome")
        : { explore: "emptyExplore", liked: "emptyLiked", bookmarks: "emptyBookmarks", profile: "emptyProfile", notifications: "emptyNotif" }[v];
      tl.innerHTML = banner + emptyHTML(key);
      return;
    }
    const prof = v === "profile" && state.profile ? state.profile.u : null;
    const myName = state.me && state.me.username;
    tl.innerHTML = banner + posts.map((p) => postHTML(p, {
      repostBy: prof && p.author_id !== prof.id ? prof.name : null,
      notif: v === "notifications" ? (p.reply_to_username === myName && !mentions(p.content, myName) ? "reply" : "mention") : null,
    })).join("") + (state.hasMore ? `<button class="load-more" id="loadMore">${esc(t(state.loading ? "loading" : "loadMore"))}</button>` : "");
  }

  async function loadTimeline(more = false) {
    if (!sb) return renderTimeline();
    if (more && state.loading) return;
    const seq = more ? loadSeq : ++loadSeq;
    state.loading = true;
    if (!more) { state.posts = []; state.hasMore = false; }
    renderTimeline();
    try {
      let q = sb.from("feed").select("*").order("created_at", { ascending: false }).limit(PAGE);
      if (more && state.posts.length) q = q.lt("created_at", state.posts[state.posts.length - 1].created_at);
      let skip = false;
      const v = state.view;

      if (v === "home") {
        q = q.is("reply_to", null);
        if (state.tab === "following") {
          if (!state.me) skip = true;
          else {
            const ids = [...state.following].filter(([, s]) => s === "accepted").map(([id]) => id);
            q = q.in("author_id", [state.me.id, ...ids]);
          }
        }
      } else if (v === "explore") {
        const s = cleanQuery(state.query);
        if (s) q = q.or(`content.ilike.%${s}%,name.ilike.%${s}%,username.ilike.%${s}%`);
      } else if (v === "liked" || v === "bookmarks") {
        const set = v === "liked" ? state.liked : state.bookmarked;
        if (!state.me || !set.size) skip = true;
        else q = q.in("id", [...set].slice(0, 300));
      } else if (v === "notifications") {
        if (!state.me) skip = true;
        else q = notifQuery(q);
      } else if (v === "profile") {
        if (!state.profile || !state.profile.canSee) skip = true;
        else {
          const ids = state.profileReposts;
          q = ids.length ? q.or(`author_id.eq.${state.profileId},id.in.(${ids.join(",")})`) : q.eq("author_id", state.profileId);
        }
      }

      if (!skip) {
        const { data, error } = await q;
        if (error) throw error;
        if (seq !== loadSeq) return;
        const rows = v === "notifications" ? data.filter(isNotifFor) : data;
        state.posts = more ? state.posts.concat(rows) : rows;
        state.hasMore = data.length === PAGE;
      }
    } catch (e) {
      console.error(e);
      if (seq === loadSeq) toast(t("loadError"));
    } finally {
      if (seq === loadSeq) { state.loading = false; renderTimeline(); }
    }
  }

  /* ---------------- Notificações (marcações e respostas) ---------------- */
  const mentions = (text, username) => !!username && new RegExp("(^|[^\\w])@" + username + "(?!\\w)", "i").test(text || "");
  function isNotifFor(p) {
    const u = state.me && state.me.username;
    return !!u && p.author_id !== state.me.id && (p.reply_to_username === u || mentions(p.content, u));
  }
  function notifQuery(q) {
    const u = state.me.username;
    return q.neq("author_id", state.me.id).or(`content.ilike.%@${u}%,reply_to_username.eq.${u}`);
  }
  const seenKey = () => "komu:notifSeen:" + (state.me ? state.me.id : "");
  async function loadNotifCount() {
    if (!sb || !state.me) { state.notifCount = 0; return renderNotifBadge(); }
    const since = ls.get(seenKey()) || new Date(0).toISOString();
    try {
      const { data } = await notifQuery(sb.from("feed").select("id,author_id,content,reply_to_username,created_at"))
        .gt("created_at", since).order("created_at", { ascending: false }).limit(50);
      state.notifCount = (data || []).filter(isNotifFor).length;
    } catch { state.notifCount = 0; }
    renderNotifBadge();
  }
  function renderNotifBadge() {
    const n = state.me ? state.notifCount + state.requests.length : 0;
    $$("[data-notif-badge]").forEach((el) => { el.hidden = !n; el.textContent = n > 9 ? "9+" : n; });
  }
  function markNotifsSeen() {
    if (!state.me) return;
    ls.set(seenKey(), new Date().toISOString());
    state.notifCount = 0; renderNotifBadge();
  }

  /* ---------------- Assuntos e sugestões ---------------- */
  async function loadTrends() {
    if (!sb) return;
    const { data } = await sb.from("posts").select("content").order("created_at", { ascending: false }).limit(300);
    const counts = {};
    (data || []).forEach((p) => (p.content.match(/#[\wÀ-ÿ]+/g) || []).forEach((tag) => {
      const k = tag.toLowerCase(); counts[k] = (counts[k] || 0) + 1;
    }));
    state.trends = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    renderTrends();
  }
  function renderTrends() {
    if (!state.trends) { $("#trends").innerHTML = sb ? '<div class="spinner sm"></div>' : ""; return; }
    $("#trends").innerHTML = state.trends.length
      ? state.trends.map(([tag, n], i) => `<button class="trend" data-search="${esc(tag)}"><small>${esc(t("trendLabel", { i: i + 1 }))}</small><b>${esc(tag)}</b><small>${esc(n === 1 ? t("posts1") : t("postsN", { n }))}</small></button>`).join("")
      : `<p class="muted" style="padding:0 16px 16px">${esc(t("noTrends"))}</p>`;
  }

  async function loadWhoToFollow() {
    if (!sb) return;
    let q = sb.from("profiles").select("id,username,name,color,avatar_url,is_private").order("created_at", { ascending: false }).limit(15);
    if (state.me) q = q.neq("id", state.me.id);
    const { data } = await q;
    state.suggestions = (data || []).filter((u) => !state.following.has(u.id)).slice(0, 4);
    renderFollow();
  }
  function followBtnHTML(id) {
    const s = state.following.get(id);
    return `<button class="btn-follow ${s ? "following" : ""}" data-follow="${id}">${esc(t(s === "accepted" ? "followingBtn" : s === "pending" ? "requestedBtn" : "followBtn"))}</button>`;
  }
  function renderFollow() {
    const list = state.suggestions;
    if (!list) { $("#whoToFollow").innerHTML = sb ? '<div class="spinner sm"></div>' : ""; return; }
    $("#whoToFollow").innerHTML = list.length ? list.map((u) => `
      <div class="follow">
        <div class="clickable" data-user="${u.id}">${avatarHTML(u)}</div>
        <div class="names clickable" data-user="${u.id}"><div style="font-weight:700">${esc(u.name)} ${u.is_private ? lockHTML() : ""}</div><div class="muted">@${esc(u.username)}</div></div>
        ${followBtnHTML(u.id)}
      </div>`).join("") : `<p class="muted" style="padding:0 16px 16px">${esc(t("noSuggestions"))}</p>`;
  }

  /* =================================================================
     Perfil
     ================================================================= */
  async function loadProfile() {
    const id = state.profileId;
    const [prof, followers, following] = await Promise.all([
      sb.from("profiles").select("*").eq("id", id).maybeSingle(),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("following_id", id).eq("status", "accepted"),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", id).eq("status", "accepted"),
    ]);
    if (id !== state.profileId) return;
    const u = prof.data;
    if (!u) { state.profile = false; renderProfileHead(); return; }
    const isMe = !!state.me && state.me.id === id;
    const canSee = !u.is_private || isMe || state.following.get(id) === "accepted";
    state.profileReposts = [];
    if (canSee) {
      const reps = await sb.from("reposts").select("post_id").eq("user_id", id).order("created_at", { ascending: false }).limit(100);
      state.profileReposts = (reps.data || []).map((r) => r.post_id);
    }
    if (id !== state.profileId) return;
    state.profile = { u, followers: followers.count ?? 0, following: following.count ?? 0, canSee };
    renderProfileHead(); renderNav();
  }

  function renderProfileHead() {
    const head = $("#profileHead");
    if (state.view !== "profile") { head.innerHTML = ""; return; }
    const P = state.profile;
    if (P === null) { head.innerHTML = '<div class="spinner"></div>'; return; }
    if (P === false) { head.innerHTML = `<div class="empty"><h2>${esc(t("profileNotFound"))}</h2></div>`; return; }
    const u = P.u;
    const isMe = state.me && state.me.id === u.id;
    const cover = u.cover_url ? ` style="background-image:url('${esc(u.cover_url)}')"` : "";
    head.innerHTML = `
      <div class="profile-head">
        <div class="profile-cover"${cover}></div>
        <div class="profile-info">
          <div class="profile-row">
            ${avatarHTML(u)}
            ${isMe ? `<button class="btn-outline" data-open-settings>${esc(t("editProfile"))}</button>` : followBtnHTML(u.id)}
          </div>
          <h2>${esc(u.name)} ${u.is_private ? lockHTML() : ""}</h2>
          <div class="muted">@${esc(u.username)}</div>
          <div class="muted" style="margin-top:8px">${esc(t("joined", { date: new Date(u.created_at).toLocaleDateString(locale(), { month: "long", year: "numeric" }) }))}</div>
          <div class="profile-stats"><span><b>${P.following}</b> ${esc(t("followingCount"))}</span><span><b>${P.followers}</b> ${esc(t("followers"))}</span></div>
        </div>
      </div>`;
  }

  /* =================================================================
     Navegação
     ================================================================= */
  async function go(view, extra = {}) {
    if (view === "me") {
      if (!requireAuth()) return;
      view = "profile"; extra.profileId = state.me.id;
    }
    state.view = view;
    state.profileId = extra.profileId || null;
    state.profile = null;
    if (view !== "explore") { state.query = ""; $("#searchInput").value = ""; }
    state.pending = 0; renderNewPosts();
    window.scrollTo({ top: 0 });
    renderNav(); renderProfileHead();
    if (view === "notifications") markNotifsSeen();
    if (view === "profile") {
      ++loadSeq; state.posts = []; state.loading = true; renderTimeline();
      await loadProfile();
      if (!state.profile) { state.loading = false; renderTimeline(); return; }
    }
    loadTimeline();
  }

  function renderNav() {
    const titles = { home: t("home"), explore: state.query ? t("searchTitle", { q: state.query }) : t("explore"), liked: t("liked"), bookmarks: t("bookmarks"), notifications: t("notifications"), profile: state.profile ? state.profile.u.name : t("profile") };
    $("#viewTitle").textContent = titles[state.view];
    $("#tabs").style.display = state.view === "home" ? "flex" : "none";
    $("#backBtn").hidden = state.view !== "profile";

    $("#mobileMe").style.width = state.view === "profile" ? "0" : "";
    $("#inlineComposer").hidden = !(state.view === "home" && state.me && sb);

    $$("[data-go]").forEach((el) => {
      const g = el.dataset.go;

  function renderMe() {
    const m = state.me;
    $$("[data-me-avatar]").forEach((el) => { el.innerHTML = m ? avatarInner(m) : "?"; el.style.background = m ? m.color : "#444"; });
    $$("[data-me-name]").forEach((el) => (el.textContent = m ? m.name : t("login")));
    $$("[data-me-handle]").forEach((el) => (el.textContent = m ? "@" + m.username : t("orSignup")));

  function renderNewPosts() {
    const b = $("#newPosts");

  /* =================================================================
     Autenticação (com 2FA)
     ================================================================= */
  function requireAuth() {
    if (!sb) { toast(t("configureFirst")); return false; }
    if (!state.me) { if (state.mfaPending) openMfaStep(); else openAuth(); return false; }
    return true;
  }

  async function loadMe(session) {
    if (!session) {
      state.me = null; state.requests = []; state.reported.clear(); state.notifCount = 0;
      state.liked.clear(); state.reposted.clear(); state.bookmarked.clear(); state.following.clear();
      return;
    }
    const uid = session.user.id;
    const [prof, l, r, b, f] = await Promise.all([
      sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
      sb.from("likes").select("post_id").eq("user_id", uid),
      sb.from("reposts").select("post_id").eq("user_id", uid),
      sb.from("bookmarks").select("post_id").eq("user_id", uid),
      sb.from("follows").select("following_id,status").eq("follower_id", uid),
    ]);
    state.me = prof.data || null;
    state.liked = new Set((l.data || []).map((x) => x.post_id));
    state.reposted = new Set((r.data || []).map((x) => x.post_id));
    state.bookmarked = new Set((b.data || []).map((x) => x.post_id));
    state.following = new Map((f.data || []).map((x) => [x.following_id, x.status || "accepted"]));
    const rep = await sb.from("reports").select("post_id").eq("reporter_id", uid);
    state.reported = new Set(((rep && rep.data) || []).map((x) => x.post_id));
    await loadRequests();
    loadNotifCount();
  }

  async function loadRequests() {
    if (!state.me) { state.requests = []; return; }
    const { data } = await sb.from("follows").select("follower_id").eq("following_id", state.me.id).eq("status", "pending").limit(100);
    const ids = (data || []).map((x) => x.follower_id);
    if (!ids.length) { state.requests = []; return; }
    const { data: profs } = await sb.from("profiles").select("id,username,name,color,avatar_url").in("id", ids);
    state.requests = profs || [];
  }

  async function needsMfa() {
    try {
      const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      return !!data && data.nextLevel === "aal2" && data.currentLevel !== "aal2";
    } catch { return false; }
  }

  let authKey;
  async function syncAuth() {
    const { data } = await sb.auth.getSession();
    const session = data.session;
    const mfa = session ? await needsMfa() : false;
    const key = !session ? "none" : session.user.id + (mfa ? ":mfa" : ":ok");
    if (key === authKey) return;
    const first = authKey === undefined;
    authKey = key;

    if (mfa) { await loadMe(null); state.mfaPending = true; openMfaStep(); }
    else {
      state.mfaPending = false;
      await loadMe(session);
      if (!$("#authStepMfa").hidden) closeModal($("#authModal"));
    }
    renderMe(); renderNav();
    if (state.me && state.requests.length) toast(state.requests.length === 1 ? t("newRequests1") : t("newRequestsN", { n: state.requests.length }));
    if (!first) {
      if (state.view === "profile") go("profile", { profileId: state.profileId });
      else if (!state.me && ["liked", "bookmarks"].includes(state.view)) go("home");
      else go(state.view);
      loadWhoToFollow();
    }
  }

  function setAuthMode(mode, keepMsg) {
    $("#authForm").dataset.mode = mode;
    $$("[data-auth]").forEach((b) => b.classList.toggle("on", b.dataset.auth === mode));
    $("#authTitle").textContent = t(mode === "login" ? "authLoginTitle" : "authSignupTitle");
    $("#authSubmit").textContent = t(mode === "login" ? "login" : "signup");
    $("#auPass").autocomplete = mode === "login" ? "current-password" : "new-password";
    if (!keepMsg) msg("#authMsg", "");
  }
  function msg(sel, text, kind) { const m = $(sel); if (!m) return; m.textContent = text; m.classList.toggle("error", kind === "error"); m.classList.toggle("ok", kind === "ok"); }
  function openAuth(mode = "login") {
    if (!sb) { toast(t("configureFirst")); return; }
    $("#authStepForm").hidden = false; $("#authStepMfa").hidden = true;
    setAuthMode(mode); openModal($("#authModal"));
    setTimeout(() => $("#auEmail").focus(), 30);
  }
  function openMfaStep() {
    $("#authStepForm").hidden = true; $("#authStepMfa").hidden = false;
    $("#mfaCode").value = ""; msg("#mfaMsg", "");
    if (!$("#authModal").classList.contains("open")) openModal($("#authModal"));
    setTimeout(() => $("#mfaCode").focus(), 30);
  }
  $$("[data-auth]").forEach((b) => b.addEventListener("click", () => setAuthMode(b.dataset.auth)));

  $("#authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mode = e.target.dataset.mode;
    const email = $("#auEmail").value.trim();
    const password = $("#auPass").value;
    const btn = $("#authSubmit");
    if (!/^\S+@\S+\.\S+$/.test(email)) return msg("#authMsg", t("errEmail"), "error");
    if (password.length < 6) return msg("#authMsg", t("errPass"), "error");
    btn.disabled = true;
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw new Error(/confirm/i.test(error.message) ? t("errConfirm") : t("errCreds"));
        $("#auPass").value = "";
        if (await needsMfa()) { state.mfaPending = true; openMfaStep(); return; }
        closeModal($("#authModal"));
        toast(t("welcome"));
      } else {
        const name = $("#auName").value.trim();
        const username = $("#auUser").value.trim().toLowerCase().replace(/^@/, "");
        if (!name) throw new Error(t("errName"));
        if (!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error(t("errUser"));
        const { data: taken } = await sb.from("profiles").select("id").eq("username", username).maybeSingle();
        if (taken) throw new Error(t("errUserTaken"));
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { name, username, color }, emailRedirectTo: location.href.split("#")[0] },
        });
        if (error) throw new Error(/registered/i.test(error.message) ? t("errEmailTaken") : error.message);
        if (!data.session) {
          msg("#authMsg", t("checkEmail"), "ok");
          setTimeout(() => setAuthMode("login", true), 4000);
          return;
        }
        closeModal($("#authModal"));
        toast(t("accountCreated"));
      }
    } catch (err) {
      msg("#authMsg", err.message || t("errGeneric"), "error");
    } finally {
      btn.disabled = false;
    }
  });

  $("#mfaCode").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
    if (e.target.value.length === 6 && !$("#mfaSubmit").disabled) $("#mfaForm").requestSubmit();
  });
  $("#mfaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("#mfaCode").value.replace(/\D/g, "");
    if (code.length !== 6) return msg("#mfaMsg", t("errCode"), "error");
    const btn = $("#mfaSubmit");
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      const { data: f, error: e1 } = await sb.auth.mfa.listFactors();
      const factor = f && f.totp && f.totp[0];
      if (e1 || !factor) throw e1 || new Error("no factor");
      const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
      if (error) { msg("#mfaMsg", t("errCode"), "error"); $("#mfaCode").select(); return; }
      state.mfaPending = false;
      closeModal($("#authModal"));
      toast(t("welcome"));
      syncAuth();
    } catch (err) {
      console.error(err); msg("#mfaMsg", errMsg(t("errGeneric"), err), "error");
    } finally { btn.disabled = false; }
  });
  $("#mfaCancel").addEventListener("click", async () => {
    state.mfaPending = false;
    closeModal($("#authModal"));
    await sb.auth.signOut();
  });

     Configurações: perfil, foto, capa, privacidade, 2FA, idioma
     ================================================================= */

  // Recorta no centro e reduz a imagem antes de enviar (foto 400×400, capa 1500×500)
  function resizeImage(file, w, h) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
        const sw = w / scale, sh = h / scale;
        const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error("blob"))), "image/jpeg", 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }

  async function handleUpload(kind, file) {
    if (!file || !draft) return;
    if (!/^image\//.test(file.type)) return msg("#stMsg", t("uploadError"), "error");
    const [w, h] = kind === "avatar" ? [400, 400] : [1500, 500];
    msg("#stMsg", t("uploading"));
    $("#stSave").disabled = true;
    try {
      const blob = await resizeImage(file, w, h);
      const path = `${state.me.id}/${kind}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from("media").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
      if (error) throw error;
      const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
      draft.uploads.push(url);
      draft[kind === "avatar" ? "avatar_url" : "cover_url"] = url;
      msg("#stMsg", "");
      renderSettingsMedia();
    } catch (e) {
      console.error(e); msg("#stMsg", errMsg(t("uploadError"), e), "error");
    } finally { $("#stSave").disabled = false; }
  }

  function removeFiles(urls) {
    if (!state.me || !urls.length) return;
    const paths = urls.map((u) => (u || "").split("/object/public/media/")[1])
      .filter((p) => p && p.startsWith(state.me.id + "/"));
    if (paths.length) sb.storage.from("media").remove(paths).catch(() => {});
  }

  $("#stSave").addEventListener("click", async () => {
    const name = $("#stName").value.trim();
    if (!name) return msg("#stMsg", t("errName"), "error");
    const upd = { name, color: draft.color, is_private: $("#stPrivate").checked, avatar_url: draft.avatar_url, cover_url: draft.cover_url };
    $("#stSave").disabled = true;
    const { error } = await sb.from("profiles").update(upd).eq("id", state.me.id);
    $("#stSave").disabled = false;
    if (error) { console.error(error); return msg("#stMsg", errMsg(t("saveError"), error), "error"); }
    const keep = [upd.avatar_url, upd.cover_url];
    const unused = [state.me.avatar_url, state.me.cover_url, ...draft.uploads].filter((u) => u && !keep.includes(u));
    removeFiles([...new Set(unused)]);
    draft.uploads = [];
    Object.assign(state.me, upd);
    closeModal($("#settingsModal"));
    renderMe(); toast(t("profileUpdated"));

  $("#st2fa").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-2fa]"); if (!b) return;
    const act = b.dataset["2fa"];

    try {
      if (act === "enable") {
        const { data: l } = await sb.auth.mfa.listFactors();

          if (f.factor_type === "totp" && f.status !== "verified") await sb.auth.mfa.unenroll({ factorId: f.id });

  /* =================================================================
     Autocompletar @marcações
     ================================================================= */
  let mbox = null, mItems = [], mSel = 0, mTimer = null, mReq = 0;
  function closeMentions() { mbox?.remove(); mbox = null; mItems = []; }
  function renderMentions(ta, onPick) {
    if (!mItems.length) return closeMentions();
    if (!mbox) {
      mbox = document.createElement("div"); mbox.className = "mention-box"; mbox.setAttribute("role", "listbox");
      document.body.appendChild(mbox);
      mbox.addEventListener("mousedown", (e) => e.preventDefault());
    }
    mbox.innerHTML = mItems.map((u, i) => `<button type="button" role="option" class="${i === mSel ? "sel" : ""}" data-i="${i}">${avatarHTML(u)}<div class="names"><div style="font-weight:700">${esc(u.name)}</div><div class="muted">@${esc(u.username)}</div></div></button>`).join("");
    mbox.onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) onPick(mItems[+b.dataset.i]); };
    const r = ta.getBoundingClientRect();
    const top = Math.min(r.bottom + 4, innerHeight - mbox.offsetHeight - 8);
    mbox.style.top = Math.max(8, top) + "px";
    mbox.style.left = Math.max(8, Math.min(r.left, innerWidth - mbox.offsetWidth - 8)) + "px";
  }
  function mentionToken(ta) {
    const pos = ta.selectionStart ?? 0;
    const m = ta.value.slice(0, pos).match(/(^|\s)@(\w{1,20})$/);
    return m ? { start: pos - m[2].length - 1, query: m[2].toLowerCase(), end: pos } : null;
  }
  function attachMentions(ta, update) {
    const pick = (u) => {
      const tok = mentionToken(ta); if (!tok) return closeMentions();
      ta.value = ta.value.slice(0, tok.start) + "@" + u.username + " " + ta.value.slice(tok.end);
      const p = tok.start + u.username.length + 2;
      ta.focus(); ta.selectionStart = ta.selectionEnd = p;
      closeMentions(); update();
    };
    ta.addEventListener("input", () => {
      clearTimeout(mTimer);
      const tok = mentionToken(ta);
      if (!tok || !sb) return closeMentions();
      mTimer = setTimeout(async () => {
        const req = ++mReq;
        const { data } = await sb.from("profiles").select("id,username,name,color,avatar_url")
          .ilike("username", tok.query.replace(/_/g, "\\_") + "%").order("username").limit(5);
        if (req !== mReq || !mentionToken(ta)) return;
        mItems = data || []; mSel = 0; renderMentions(ta, pick);
      }, 150);
    });
    ta.addEventListener("keydown", (e) => {
      if (!mbox || !mItems.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        mSel = (mSel + (e.key === "ArrowDown" ? 1 : -1) + mItems.length) % mItems.length;
        renderMentions(ta, pick);
      } else if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault(); e.stopPropagation(); pick(mItems[mSel]);
      } else if (e.key === "Escape") { e.stopPropagation(); closeMentions(); }
    });
    ta.addEventListener("blur", () => setTimeout(closeMentions, 120));
  }

  /* =================================================================
     Composer
     ================================================================= */
  function setupComposer(root, onSubmit) {
    const ta = $("textarea", root);
    const btn = $(".composer-actions .btn-primary", root);
    const counter = $(".counter", root), bar = $(".bar", counter), label = $("span", counter);
    const C = 62.83;
    let busy = false;
    function update() {
      ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
      const len = [...ta.value].length, left = MAX - len;
      bar.style.strokeDashoffset = C - Math.min(len / MAX, 1) * C;
      counter.classList.toggle("warn", left <= 20 && left >= 0);
      counter.classList.toggle("over", left < 0);
      label.textContent = left <= 20 ? left : "";
      counter.style.visibility = len ? "visible" : "hidden";
      btn.disabled = busy || !ta.value.trim() || left < 0;
    }
    function insert(text, spaceBefore) {
      const pos = ta.selectionStart ?? ta.value.length;
      const end = ta.selectionEnd ?? pos;
      const pre = ta.value.slice(0, pos);
      const piece = (spaceBefore && pre && !/\s$/.test(pre) ? " " : "") + text;
      ta.value = pre + piece + ta.value.slice(end);
      ta.focus(); ta.selectionStart = ta.selectionEnd = pos + piece.length; update();
    }
    ta.addEventListener("input", update);
    ta.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) btn.click(); });
    btn.addEventListener("click", async () => {
      const text = ta.value.trim();
      if (!text || [...text].length > MAX || busy) return;
      busy = true; update(); closePicker();
      const ok = await onSubmit(text);
      busy = false;
      if (ok) ta.value = "";
      update();
    });
    $$("[data-insert]", root).forEach((b) => b.addEventListener("click", () => insert(b.dataset.insert, true)));
    attachMentions(ta, update);
    const eb = $("[data-emoji-btn]", root);
    eb.addEventListener("mousedown", (e) => e.preventDefault());
    eb.addEventListener("click", () => {
      if (pickerAnchor === eb) return closePicker();
      openPicker(eb, (emoji) => insert(emoji, false));
    });
    update();
    return { ta, update };
  }

  /* ---------------- Ações nos posts ---------------- */
  async function toggle(table, set, post, countField) {
    if (!requireAuth()) return null;
    const on = !set.has(post.id);
    on ? set.add(post.id) : set.delete(post.id);
    if (countField) post[countField] += on ? 1 : -1;
    const res = on
      ? await sb.from(table).insert({ post_id: post.id, user_id: state.me.id })
      : await sb.from(table).delete().eq("post_id", post.id).eq("user_id", state.me.id);
    if (res.error && res.error.code !== "23505") {
      on ? set.delete(post.id) : set.add(post.id);
      if (countField) post[countField] += on ? -1 : 1;
      toast(t("errGeneric"));
      return null;
    }
    return on;
  }

  $("#timeline").addEventListener("click", async (e) => {

    if (mention) {
      const { data } = await sb.from("profiles").select("id").eq("username", mention.dataset.username.toLowerCase()).maybeSingle();
      return data ? go("profile", { profileId: data.id }) : toast(t("userNotFound"));

    const userEl = e.target.closest("[data-user]");
    if (userEl) return go("profile", { profileId: userEl.dataset.user });
    if (e.target.id === "loadMore") return loadTimeline(true);

    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.closest(".post").dataset.id;
    const post = state.posts.find((p) => p.id === id);
    if (!post) return;
    const act = btn.dataset.action;

    if (act === "like" || act === "repost") {
      if (!state.me) return requireAuth();
      const [table, set, field] = act === "like" ? ["likes", state.liked, "like_count"] : ["reposts", state.reposted, "repost_count"];
      const willBeOn = !set.has(id);
      btn.classList.toggle("on", willBeOn);
      btn.lastElementChild.textContent = fmt(post[field] + (willBeOn ? 1 : -1));
      if (act === "like") { btn.classList.remove("pop"); void btn.offsetWidth; if (willBeOn) btn.classList.add("pop"); }
      const result = await toggle(table, set, post, field);
      if (result === null) { btn.classList.toggle("on", set.has(id)); btn.lastElementChild.textContent = fmt(post[field]); }
      else if (act === "repost") toast(t(result ? "reposted" : "unreposted"));
      if (act === "like" && state.view === "liked" && result === false) { state.posts = state.posts.filter((p) => p.id !== id); renderTimeline(); }
    } else if (act === "bookmark") {

    if (status === "pending") toast(t("requestSent"));
    renderFollow();
    if (state.view === "profile" && state.profileId === id) {
      const before = state.profile && state.profile.canSee;
      await loadProfile();
      if (state.profile && state.profile.canSee !== before) loadTimeline();
    }
    if (state.view === "home" && state.tab === "following") loadTimeline();
  });

  /* ---------------- Busca e assuntos ---------------- */
  function search(term) {
    state.query = term; go("explore");
    $("#searchInput").value = term;
  }
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      if (state.view !== "explore") { state.view = "explore"; state.profile = null; renderProfileHead(); }
      renderNav(); loadTimeline();
    }, 300);
  });
  $("#trends").addEventListener("click", (e) => { const tr = e.target.closest("[data-search]"); if (tr) search(tr.dataset.search); });
  $("#whoToFollow").addEventListener("click", (e) => { const u = e.target.closest("[data-user]"); if (u) go("profile", { profileId: u.dataset.user }); });

  /* ---------------- Eventos gerais ---------------- */
  $$("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
  $$("[data-tab]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderNav(); loadTimeline(); }));
  $$("[data-open-compose]").forEach((b) => b.addEventListener("click", () => openCompose()));
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-auth]")) openAuth();
    if (e.target.closest("[data-open-settings]")) openSettings();
    const lb = e.target.closest("[data-lang]"); if (lb) setLang(lb.dataset.lang);
  });
  $("#meCard").addEventListener("click", () => (state.me ? openSettings() : requireAuth()));
  $("#mobileMe").addEventListener("click", () => (state.me ? openSettings() : requireAuth()));
  $("#backBtn").addEventListener("click", () => go("home"));
  $("#langToggle").addEventListener("click", () => setLang(lang === "pt" ? "en" : "pt"));
  $("#newPosts").addEventListener("click", () => { state.pending = 0; renderNewPosts(); window.scrollTo({ top: 0 }); loadTimeline(); });

  /* ---------------- Tema (padrão: escuro) ---------------- */
  const savedTheme = ls.get("komu:theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
  $("#themeToggle").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    ls.set("komu:theme", next);
  });

  setInterval(() => $$("#timeline time").forEach((el) => (el.textContent = timeAgo(Date.parse(el.getAttribute("datetime"))))), 60000);

  /* ---------------- Início ---------------- */
  async function init() {
    applyI18n();
    setAuthMode("login");
    renderMe(); renderNav();
    if (!sb) { renderSetup(); $("#trends").innerHTML = ""; $("#whoToFollow").innerHTML = ""; return; }
    renderTrends(); renderFollow();

    await syncAuth();
    renderMe(); renderNav();
    loadTimeline(); loadTrends(); loadWhoToFollow();

    sb.auth.onAuthStateChange(() => { setTimeout(syncAuth, 0); });

    // Tempo real: avisa quando outras pessoas postam
    sb.channel("novos-posts")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, (payload) => {
        if (state.me && payload.new.author_id === state.me.id) return;
        if (state.me && mentions(payload.new.content, state.me.username)) {
          if (state.view === "notifications") loadTimeline(); else { state.notifCount++; renderNotifBadge(); }
        }
        if (payload.new.reply_to) return;
        state.pending++; renderNewPosts();
      })
      .subscribe();
  }
  init();
})();
</script>
</body>
</html>
