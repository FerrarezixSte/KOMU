  /* =================================================================
     Navegação
     ================================================================= */
  const currentLoc = () => ({ view: state.view, extra: { profileId: state.profileId, postId: state.postId, dmWith: state.dmWith, query: state.query } });
  async function go(view, extra = {}, isBack = false) {
    if (view === "me") {
      if (!requireAuth()) return;
      view = "profile"; extra.profileId = state.me.id;
    }
    if (view === "messages" && !state.me && sb) { requireAuth(); return; }
    const cur = currentLoc();
    const same = cur.view === view && cur.extra.profileId === (extra.profileId || null) && cur.extra.postId === (extra.postId || null)
      && (cur.extra.dmWith && cur.extra.dmWith.id) === (extra.dmWith && extra.dmWith.id);
    if (!isBack && !same) { navStack.push(cur); if (navStack.length > 30) navStack.shift(); }

    state.view = view;
    state.profileId = extra.profileId || null;
    state.profile = null;
    state.postId = extra.postId || null;
    state.dmWith = view === "messages" ? extra.dmWith || null : null;
    state.query = view === "explore" ? extra.query || "" : "";
    $("#searchInput").value = state.query;
    state.pending = 0; renderNewPosts();
    closePicker(); closeMentions();
    setUrl(view === "post" ? "?post=" + extra.postId : "");
    window.scrollTo({ top: 0 });
    renderNav(); renderProfileHead();
    if (view === "notifications") markNotifsSeen();
    if (view === "profile") {
      ++loadSeq; state.posts = []; state.loading = true; renderTimeline();
      await loadProfile();
      if (!state.profile) { state.loading = false; renderTimeline(); return; }
    }
    loadTimeline();
  }
  function goBack() {
    const prev = navStack.pop();
    if (prev) go(prev.view, prev.extra, true); else go("home", {}, true);
  }

  function renderNav() {
    const v = state.view;
    const titles = {
      home: t("home"), explore: t("explore"), liked: t("liked"), bookmarks: t("bookmarks"), notifications: t("notifications"),
      messages: state.dmWith ? state.dmWith.name : t("messages"), post: t("postView"),
      profile: state.profile ? state.profile.u.name : t("profile"),
    };
    $("#viewTitle").textContent = titles[v];
    $("#tabs").style.display = v === "home" ? "flex" : "none";

    $("#backBtn").hidden = !showBack;
    $("#mobileMe").style.display = showBack ? "none" : "";
    $("#inlineComposer").hidden = !(v === "home" && state.me && sb);

      ? `<button class="me-link" data-go="me" title="${esc(t("myProfile"))}">
           <span class="av-wrap">${avatarHTML(m)}<span class="badge-dot" data-req-dot hidden></span></span>
           <div class="names"><div style="font-weight:700">${esc(m.name)}</div><small>@${esc(m.username)}</small></div>
         </button>
         <button class="gear-btn" data-open-settings title="${esc(t("settings"))}" aria-label="${esc(t("settings"))}">${ICONS.gear}</button>`

         <button class="gear-btn" data-open-settings title="${esc(t("settings"))}" aria-label="${esc(t("settings"))}">${ICONS.gear}</button>`;

  function renderNewPosts() {
    const b = $("#newPosts");

  /* =================================================================
     Autenticação
     ================================================================= */
  function requireAuth() {
    if (!sb) { toast(t("configureFirst")); return false; }
    if (!state.me) { if (state.mfaPending) openMfaStep(); else openAuth(); return false; }
    return true;
  }

  async function loadMe(session) {
    state.session = session || null;
    if (!session) {
      state.me = null; state.requests = []; state.notifCount = 0; state.dmUnread = 0; state.convos = null;
      state.liked.clear(); state.reposted.clear(); state.bookmarked.clear(); state.following.clear(); state.reported.clear();
      return;
    }
    const uid = session.user.id;
    const [prof, l, r, b, f, rp] = await Promise.all([
      sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
      sb.from("likes").select("post_id").eq("user_id", uid),
      sb.from("reposts").select("post_id").eq("user_id", uid),
      sb.from("bookmarks").select("post_id").eq("user_id", uid),
      sb.from("follows").select("following_id,status").eq("follower_id", uid),
      sb.from("reports").select("post_id").eq("reporter_id", uid),
    ]);
    state.me = prof.data || null;
    state.liked = new Set((l.data || []).map((x) => x.post_id));
    state.reposted = new Set((r.data || []).map((x) => x.post_id));
    state.bookmarked = new Set((b.data || []).map((x) => x.post_id));
    state.following = new Map((f.data || []).map((x) => [x.following_id, x.status || "accepted"]));
    state.reported = new Set((rp.data || []).map((x) => x.post_id));
    await loadRequests();
    loadNotifCount(); loadDmUnread();
  }

  async function loadRequests() {
    if (!state.me) { state.requests = []; return; }
    const { data } = await sb.from("follows").select("follower_id").eq("following_id", state.me.id).eq("status", "pending").limit(100);
    const ids = (data || []).map((x) => x.follower_id);
    if (!ids.length) { state.requests = []; return; }
    const { data: profs } = await sb.from("profiles").select("id,username,name,color,avatar_url").in("id", ids);
    state.requests = profs || [];
  }

  async function needsMfa() {
    try {
      const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      return !!data && data.nextLevel === "aal2" && data.currentLevel !== "aal2";
    } catch { return false; }
  }

  let authKey;
  async function syncAuth() {
    const { data } = await sb.auth.getSession();
    const session = data.session;
    const mfa = session ? await needsMfa() : false;
    const key = !session ? "none" : session.user.id + (mfa ? ":mfa" : ":ok");
    if (key === authKey) return;
    const first = authKey === undefined;
    authKey = key;

    if (mfa) { await loadMe(null); state.mfaPending = true; openMfaStep(); }
    else {
      state.mfaPending = false;
      await loadMe(session);
      if (!$("#authStepMfa").hidden) closeModal($("#authModal"));
    }
    setupRealtime();
    renderMe(); renderNav();
    if (state.me && state.requests.length) toast(state.requests.length === 1 ? t("newRequests1") : t("newRequestsN", { n: state.requests.length }));
    if (state.me && cameFromEmailConfirm && first) toast(t("emailConfirmed"));
    if (!first) {
      const cur = currentLoc();
      if (!state.me && ["liked", "bookmarks", "messages", "notifications"].includes(cur.view)) go("home", {}, true);
      else go(cur.view, cur.view === "messages" ? {} : cur.extra, true);
      loadWhoToFollow();
    }
  }

  /* ---- Senha forte ---- */
  function pwChecks(pw, ctx = {}) {
    pw = pw || "";
    const low = pw.toLowerCase();
    const personal = [ctx.user, (ctx.email || "").split("@")[0]].filter((x) => x && x.length >= 3);
    return {
      pwLen: pw.length >= 8,
      pwUpper: /[A-ZÀ-Ý]/.test(pw),
      pwLower: /[a-zß-ÿ]/.test(pw),
      pwDigit: /\d/.test(pw),
      pwSymbol: /[^A-Za-zÀ-ÿ0-9]/.test(pw),
      pwCommon: !!pw && !WEAK_SEQUENCES.some((c) => low.includes(c)) && !WEAK_WORDS.includes(low.replace(/[^a-zà-ÿ]/g, ""))
        && !personal.some((p) => low.includes(p.toLowerCase())) && !/(.)\1{3,}/.test(pw),
    };
  }
  const pwOk = (c) => Object.values(c).every(Boolean);
  const pwRulesHTML = (c) => Object.entries(c).map(([k, ok]) => `<li class="${ok ? "ok" : ""}">${esc(t(k))}</li>`).join("");
  function renderPwRules() {
    const c = pwChecks($("#auPass").value, { user: $("#auUser").value.trim().toLowerCase(), email: $("#auEmail").value.trim() });
    $("#pwRules").innerHTML = pwRulesHTML(c);
    return c;
  }
  ["#auPass", "#auUser", "#auEmail"].forEach((s) => $(s).addEventListener("input", () => { if ($("#authForm").dataset.mode === "signup") renderPwRules(); }));

  /* ---- Modal de entrada ---- */
  function showAuthStep(step) {
    $("#authStepForm").hidden = step !== "form";
    $("#authStepCheck").hidden = step !== "check";
    $("#authStepMfa").hidden = step !== "mfa";
  }
  function setAuthMode(mode, keepMsg) {
    $("#authForm").dataset.mode = mode;
    $$("[data-auth]").forEach((b) => b.classList.toggle("on", b.dataset.auth === mode));
    $("#authTitle").textContent = t(mode === "login" ? "authLoginTitle" : "authSignupTitle");
    $("#authSubmit").textContent = t(mode === "login" ? "login" : "signup");
    $("#auPass").autocomplete = mode === "login" ? "current-password" : "new-password";
    if (mode === "signup") renderPwRules();
    if (!keepMsg) { msg("#authMsg", ""); $("#resendFromLogin").hidden = true; }
  }
  function openAuth(mode = "login") {
    if (!sb) { toast(t("configureFirst")); return; }
    showAuthStep("form"); setAuthMode(mode); openModal($("#authModal"));
    setTimeout(() => $("#auEmail").focus(), 30);
  }
  function openMfaStep() {
    showAuthStep("mfa");
    $("#mfaCode").value = ""; msg("#mfaMsg", "");
    if (!$("#authModal").classList.contains("open")) openModal($("#authModal"));
    setTimeout(() => $("#mfaCode").focus(), 30);
  }
  let pendingEmail = "", resendUntil = 0;
  function openCheckEmail(email) {
    pendingEmail = email;
    $("#checkText").textContent = t("checkText", { email });
    msg("#checkMsg", "");
    showAuthStep("check");
    if (!$("#authModal").classList.contains("open")) openModal($("#authModal"));
  }
  async function resendConfirmation(email, msgSel) {
    const left = Math.ceil((resendUntil - Date.now()) / 1000);
    if (left > 0) return msg(msgSel, t("resendWait", { s: left }), "error");
    const { error } = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) return msg(msgSel, /rate|seconds/i.test(error.message || "") ? t("resendWait", { s: 60 }) : errMsg(t("errEmailSend"), error), "error");
    resendUntil = Date.now() + 60e3;
    msg(msgSel, t("resent"), "ok");
  }
  $("#checkResend").addEventListener("click", () => resendConfirmation(pendingEmail, "#checkMsg"));
  $("#checkDone").addEventListener("click", () => { showAuthStep("form"); setAuthMode("login"); $("#auEmail").value = pendingEmail; $("#auPass").focus(); });
  $("#resendFromLogin").addEventListener("click", () => resendConfirmation($("#auEmail").value.trim(), "#authMsg"));
  $$("[data-auth]").forEach((b) => b.addEventListener("click", () => setAuthMode(b.dataset.auth)));

  $("#authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mode = e.target.dataset.mode;
    const email = $("#auEmail").value.trim();
    const password = $("#auPass").value;
    const btn = $("#authSubmit");
    $("#resendFromLogin").hidden = true;
    if (!/^\S+@\S+\.\S+$/.test(email)) return msg("#authMsg", t("errEmail"), "error");
    if (!password) return msg("#authMsg", t("errPassEmpty"), "error");
    btn.disabled = true;
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          if (/confirm/i.test(error.message)) { $("#resendFromLogin").hidden = false; throw new Error(t("errConfirm")); }
          throw new Error(t("errCreds"));
        }
        $("#auPass").value = "";
        if (await needsMfa()) { state.mfaPending = true; openMfaStep(); return; }
        closeModal($("#authModal"));
        toast(t("welcome"));
      } else {
        const name = $("#auName").value.trim();
        const username = $("#auUser").value.trim().toLowerCase().replace(/^@/, "");
        if (!name) throw new Error(t("errName"));
        if (!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error(t("errUser"));
        if (!pwOk(renderPwRules())) throw new Error(t("errPassWeak"));
        const { data: taken } = await sb.from("profiles").select("id").eq("username", username).maybeSingle();
        if (taken) throw new Error(t("errUserTaken"));
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { name, username, color }, emailRedirectTo: location.origin + location.pathname },
        });
        if (error) {
          if (/registered|already/i.test(error.message)) throw new Error(t("errEmailTaken"));
          if (/sending|smtp|confirmation email/i.test(error.message)) throw new Error(t("errEmailSend"));
          if (/password/i.test(error.message)) throw new Error(t("errPassWeak") + " (" + error.message + ")");
          throw new Error(error.message);
        }
        $("#auPass").value = "";
        if (!data.session) { resendUntil = Date.now() + 60e3; openCheckEmail(email); return; }
        closeModal($("#authModal"));
        toast(t("accountCreated"));
      }
    } catch (err) {
      msg("#authMsg", err.message || t("errGeneric"), "error");
    } finally {
      btn.disabled = false;
    }
  });

  $("#mfaCode").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
    if (e.target.value.length === 6 && !$("#mfaSubmit").disabled) $("#mfaForm").requestSubmit();
  });
  $("#mfaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("#mfaCode").value.replace(/\D/g, "");
    if (code.length !== 6) return msg("#mfaMsg", t("errCode"), "error");
    const btn = $("#mfaSubmit");
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      const { data: f, error: e1 } = await sb.auth.mfa.listFactors();
      const factor = f && f.totp && f.totp[0];
      if (e1 || !factor) throw e1 || new Error("no factor");
      const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
      if (error) { msg("#mfaMsg", t("errCode"), "error"); $("#mfaCode").select(); return; }
      state.mfaPending = false;
      closeModal($("#authModal"));
      toast(t("welcome"));
      syncAuth();
    } catch (err) {
      console.error(err); msg("#mfaMsg", errMsg(t("errGeneric"), err), "error");
    } finally { btn.disabled = false; }
  });
  $("#mfaCancel").addEventListener("click", async () => {
    state.mfaPending = false;
    closeModal($("#authModal"));
    await sb.auth.signOut();
  });

  /* =================================================================
     Tempo real: notificações, seguidores e mensagens
     ================================================================= */
  function setupRealtime() {
    if (!sb) return;
    channels.forEach((c) => sb.removeChannel(c));
    channels = [];

    channels.push(sb.channel("posts-" + Date.now())
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, async (payload) => {
        const p = payload.new;
        if (state.me && p.author_id === state.me.id) return;
        if (state.me) {
          let isNotif = mentions(p.content, state.me.username);

        }
        if (state.view === "post" && p.reply_to === state.postId) loadPostView();
        if (p.reply_to) return;
        state.pending++; renderNewPosts();
      }).subscribe());

    if (!state.me) return;
    const me = state.me.id;
    channels.push(sb.channel("follows-" + me + "-" + Date.now())
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "follows", filter: `following_id=eq.${me}` }, async (payload) => {

        } else onNewNotif(t("newFollower"));
      }).subscribe());

    channels.push(sb.channel("dm-" + me + "-" + Date.now())
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `recipient_id=eq.${me}` }, async (payload) => {

          renderTimeline(); markThreadRead(m.sender_id);
          return;
        }
        state.dmUnread++; renderBadges();
        const { data: u } = await sb.from("profiles").select("name").eq("id", m.sender_id).maybeSingle();
        toast(t("newMessageFrom", { name: (u && u.name) || "" }));
        if (state.view === "messages" && !state.dmWith) loadConversations();
      }).subscribe());
  }

  // Recorta no centro e reduz (crop = true) ou só reduz mantendo a proporção (crop = false)
  function resizeImage(file, w, h, crop = true, type = "image/jpeg", quality = 0.88) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0, cw = w, ch = h;
        if (crop) {
          const scale = Math.max(w / sw, h / sh);
          sw = w / scale; sh = h / scale;
          sx = (img.naturalWidth - sw) / 2; sy = (img.naturalHeight - sh) / 2;
        } else {
          const scale = Math.min(1, w / sw, h / sh);
          cw = Math.round(sw * scale); ch = Math.round(sh * scale);
        }
        const c = document.createElement("canvas"); c.width = cw; c.height = ch;
        const ctx = c.getContext("2d");
        if (type === "image/jpeg") { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch); }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error("blob"))), type, quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t("badFile"))); };
      img.src = url;
    });
  }
  async function uploadFile(blob, folder, ext, contentType) {

    const { error } = await sb.storage.from("media").upload(path, blob, { contentType, cacheControl: "31536000", upsert: false });
    if (error) throw error;
    return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  }

    if (!svg.trimStart().startsWith("<")) { try { svg = decodeURIComponent(svg); } catch {} }

  async function load2fa() {

  function render2fa() {

        <button class="btn-outline danger btn-sm" data-2fa="disable">${esc(t("disable"))}</button><p class="form-msg" id="tfMsg"></p>`;
      return;
    }
    if (twofa.status === "enrolling") {
      box.innerHTML = `${head}
        <p>${esc(t("scanQr"))}</p>
        <img class="qr" src="${twofa.qr}" alt="QR code">
        <p>${esc(t("orKey"))}</p>

        <p>${esc(t("enterCode"))}</p>
        <div class="field"><input id="tfCode" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
        <p class="form-msg" id="tfMsg"></p>

          <button class="btn-outline btn-sm" data-2fa="cancel">${esc(t("cancel"))}</button>

  $("#st2fa").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-2fa]"); if (!b) return;
    const act = b.dataset["2fa"];
    b.disabled = true;
    try {
      if (act === "enable") {
        const { data: l } = await sb.auth.mfa.listFactors();
        for (const f of (l && l.all) || []) {
          if (f.factor_type === "totp" && f.status !== "verified") await sb.auth.mfa.unenroll({ factorId: f.id });
        }
        const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "KOMU " + Date.now(), issuer: "KOMU" });

        twofa = { status: "enrolling", factorId: data.id, qr: qrSrc(data.totp.qr_code), secret: data.totp.secret };

      } else if (act === "cancel") {
        await sb.auth.mfa.unenroll({ factorId: twofa.factorId });

      } else if (act === "disable") {
        if (!confirm(t("confirmDisable"))) { b.disabled = false; return; }
        const { error } = await sb.auth.mfa.unenroll({ factorId: twofa.factorId });
        if (error) throw error;
        await sb.auth.refreshSession();
        twofa = { status: "off" }; render2fa(); toast(t("twofaDisabled"));
      }
    } catch (err) {

  /* =================================================================
     Autocompletar @marcações (aparece assim que digita @)
     ================================================================= */
  let mbox = null, mItems = [], mSel = 0, mTimer = null, mReq = 0, mTa = null;
  function closeMentions() { mbox?.remove(); mbox = null; mItems = []; mTa = null; }
  function renderMentions(ta, onPick) {
    if (!mItems.length) return closeMentions();
    mTa = ta;
    if (!mbox) {
      mbox = document.createElement("div"); mbox.className = "mention-box"; mbox.setAttribute("role", "listbox");
      document.body.appendChild(mbox);
      mbox.addEventListener("mousedown", (e) => e.preventDefault());
      mbox.addEventListener("pointerdown", (e) => e.preventDefault());
    }
    mbox.innerHTML = mItems.map((u, i) => `<button type="button" role="option" class="${i === mSel ? "sel" : ""}" data-i="${i}">${avatarHTML(u)}<div class="names"><div style="font-weight:700">${esc(u.name)}</div><div class="muted">@${esc(u.username)}</div></div></button>`).join("");
    mbox.onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) onPick(mItems[+b.dataset.i]); };
    const r = ta.getBoundingClientRect();
    const h = mbox.offsetHeight;
    let top = r.bottom + 4;
    if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
    mbox.style.top = top + "px";
    mbox.style.left = Math.max(8, Math.min(r.left, innerWidth - mbox.offsetWidth - 8)) + "px";
  }
  function mentionToken(ta) {
    const pos = ta.selectionStart ?? 0;
    const m = ta.value.slice(0, pos).match(/(^|[^\w])@(\w{0,20})$/);
    return m ? { start: pos - m[2].length - 1, query: m[2].toLowerCase(), end: pos } : null;
  }
  async function suggestUsers(query) {
    if (!query) {
      // Sem letras ainda: sugere quem você segue (ou pessoas recentes)
      const ids = [...state.following.keys()].slice(0, 20);
      let q = sb.from("profiles").select("id,username,name,color,avatar_url");
      q = ids.length ? q.in("id", ids) : q.order("created_at", { ascending: false });
      if (state.me) q = q.neq("id", state.me.id);
      const { data } = await q.limit(6);
      return data || [];
    }
    const { data } = await sb.from("profiles").select("id,username,name,color,avatar_url")
      .or(`username.ilike.${query.replace(/_/g, "\\_")}%,name.ilike.%${query}%`).order("username").limit(6);
    return data || [];
  }
  function attachMentions(ta, update) {
    const pick = (u) => {
      const tok = mentionToken(ta); if (!tok) return closeMentions();
      ta.value = ta.value.slice(0, tok.start) + "@" + u.username + " " + ta.value.slice(tok.end);
      const p = tok.start + u.username.length + 2;
      ta.focus(); ta.selectionStart = ta.selectionEnd = p;
      closeMentions(); update();
    };
    const check = () => {
      clearTimeout(mTimer);
      const tok = mentionToken(ta);
      if (!tok || !sb) return closeMentions();
      mTimer = setTimeout(async () => {
        const req = ++mReq;
        const list = await suggestUsers(tok.query);
        if (req !== mReq || !mentionToken(ta)) return;
        mItems = list; mSel = 0; renderMentions(ta, pick);
      }, tok.query ? 150 : 0);
    };
    ta.addEventListener("input", check);
    ta.addEventListener("click", check);
    ta.addEventListener("keydown", (e) => {
      if (!mbox || !mItems.length || mTa !== ta) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        mSel = (mSel + (e.key === "ArrowDown" ? 1 : -1) + mItems.length) % mItems.length;
        renderMentions(ta, pick);
      } else if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault(); e.stopPropagation(); pick(mItems[mSel]);
      } else if (e.key === "Escape") { e.stopPropagation(); closeMentions(); }
    });
    ta.addEventListener("blur", () => setTimeout(() => { if (mTa === ta && document.activeElement !== ta) closeMentions(); }, 150));
    return check;
  }

    function showMsg(text) { cmsg.textContent = text || ""; cmsg.hidden = !text; }
    function update() {
      ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
      const len = [...ta.value].length, left = MAX - len;
      bar.style.strokeDashoffset = C - Math.min(len / MAX, 1) * C;
      counter.classList.toggle("warn", left <= 20 && left >= 0);
      counter.classList.toggle("over", left < 0);
      label.textContent = left <= 20 ? left : "";
      counter.style.visibility = len ? "visible" : "hidden";
      btn.disabled = busy || (!ta.value.trim() && !media.length) || left < 0;
      const single = media.some((m) => m.type !== "image");
      $("[data-media-btn]", root).disabled = single || media.length >= MAX_IMAGES;
      $$("[data-lib-btn]", root).forEach((b) => (b.disabled = media.length > 0));
    }
    function renderStrip() {
      strip.hidden = !media.length;
      strip.innerHTML = media.map((m, i) => {
        const src = m.preview || mediaSrc(m.url);
        const inner = m.type === "video" ? `<video src="${esc(src)}" muted playsinline></video>` : `<img src="${esc(src)}" alt="">`;
        return `<div class="att ${m.type === "sticker" ? "sticker" : ""}">${inner}${m.type === "gif" || m.type === "video" ? `<span class="tag">${m.type === "gif" ? "GIF" : "VIDEO"}</span>` : ""}<button type="button" class="x" data-rm="${i}" aria-label="${esc(t("close"))}">${ICONS.x}</button></div>`;
      }).join("");
      update();
    }
    strip.addEventListener("click", (e) => {
      const b = e.target.closest("[data-rm]"); if (!b) return;
      const [m] = media.splice(+b.dataset.rm, 1);
      if (m && m.preview) URL.revokeObjectURL(m.preview);
      renderStrip();
    });
    function addFiles(files) {
      showMsg("");
      for (const f of files) {
        const isVideo = /^video\/(mp4|webm|quicktime)$/.test(f.type);
        const isGif = f.type === "image/gif";
        const isImg = /^image\/(jpeg|png|webp)$/.test(f.type);
        if (!isVideo && !isGif && !isImg) { showMsg(t("badFile")); continue; }
        if (isVideo && f.size > MAX_VIDEO_MB * 1048576) { showMsg(t("fileTooBig", { mb: MAX_VIDEO_MB })); continue; }
        if (isGif && f.size > MAX_GIF_MB * 1048576) { showMsg(t("fileTooBig", { mb: MAX_GIF_MB })); continue; }
        if ((isVideo || isGif) && media.length) { showMsg(t("onlyOneVideo")); continue; }
        if (media.some((m) => m.type !== "image")) { showMsg(t("onlyOneVideo")); continue; }
        if (media.length >= MAX_IMAGES) { showMsg(t("tooManyFiles")); break; }
        media.push({ type: isVideo ? "video" : isGif ? "gif" : "image", file: f, preview: URL.createObjectURL(f) });
      }
      renderStrip();
    }
    function addLibrary(item) {
      media.splice(0, media.length, { type: item.kind, url: item.url });
      showMsg(""); renderStrip(); ta.focus();
    }
    async function uploadAll() {
      const out = [];
      for (const m of media) {
        if (!m.file) { out.push({ type: m.type, url: m.url }); continue; }
        let blob = m.file, ext = (m.file.name.split(".").pop() || "bin").toLowerCase(), ctype = m.file.type;
        if (m.type === "image") {
          // fotos grandes são reduzidas; prints PNG pequenos continuam nítidos
          if (!(ctype === "image/png" && m.file.size < 2.5 * 1048576)) {
            blob = await resizeImage(m.file, 2048, 2048, false, "image/jpeg", 0.88); ext = "jpg"; ctype = "image/jpeg";
          }
        }
        if (ctype === "video/quicktime") ext = "mov";
        const url = await uploadFile(blob, "posts", ext, ctype);
        out.push({ type: m.type, url, uploaded: true });
      }
      return out;
    }
    function reset() {
      ta.value = "";
      media.forEach((m) => m.preview && URL.revokeObjectURL(m.preview));
      media.length = 0; renderStrip(); showMsg(""); closeMentions();
    }

    ta.addEventListener("input", update);
    ta.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) btn.click(); });
    ta.addEventListener("paste", (e) => {
      const files = [...((e.clipboardData && e.clipboardData.files) || [])];
      if (files.length) { e.preventDefault(); addFiles(files); }
    });
    btn.addEventListener("click", async () => {
      const text = ta.value.trim();
      if ((!text && !media.length) || [...text].length > MAX || busy) return;
      if (!requireAuth()) return;
      busy = true; update(); closePicker(); closeMentions();
      const label0 = btn.textContent;
      if (media.some((m) => m.file)) btn.textContent = t("uploading");
      let uploaded = [];
      try {
        uploaded = await uploadAll();
        const ok = await onSubmit(text, uploaded.map(({ type, url }) => ({ type, url })));
        if (ok) reset();
        else removeFiles(uploaded.filter((m) => m.uploaded).map((m) => m.url));
      } catch (e) {
        console.error(e); showMsg(errMsg(t("uploadError"), e));
      } finally {
        busy = false; btn.textContent = label0; update();
      }
    });
    $("[data-media-btn]", root).addEventListener("click", () => { if (requireAuth()) fileInput.click(); });
    fileInput.addEventListener("change", (e) => { addFiles([...e.target.files]); e.target.value = ""; });
    $$("[data-lib-btn]", root).forEach((b) => b.addEventListener("click", () => { if (requireAuth()) openLibrary(b.dataset.libBtn, addLibrary); }));

    function insert(text, spaceBefore) {
      const pos = ta.selectionStart ?? ta.value.length;
      const end = ta.selectionEnd ?? pos;
      const pre = ta.value.slice(0, pos);
      const piece = (spaceBefore && pre && !/\s$/.test(pre) ? " " : "") + text;
      ta.value = pre + piece + ta.value.slice(end);
      ta.focus(); ta.selectionStart = ta.selectionEnd = pos + piece.length; update();
    }
    const checkMentions = attachMentions(ta, update);
    $$("[data-insert]", root).forEach((b) => b.addEventListener("click", () => {
      insert(b.dataset.insert, true);
      if (b.dataset.insert === "@") checkMentions();
    }));
    const eb = $("[data-emoji-btn]", root);
    eb.addEventListener("mousedown", (e) => e.preventDefault());
    eb.addEventListener("click", () => {
      if (pickerAnchor === eb) return closePicker();
      openPicker(eb, (emoji) => insert(emoji, false));
    });
    const api = {
      ta, update, reset, root,
      setPlaceholder(key) { ph = key; ta.placeholder = t(key); },
      refreshPlaceholder() {
        ta.placeholder = t(ph);
        $$("[data-i18n]", root).forEach((el) => (el.textContent = t(el.dataset.i18n)));
        $$("[data-i18n-aria]", root).forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
      },
      setReplyContext(html) { const c = $(".reply-context", root); c.hidden = !html; c.innerHTML = html || ""; },
    };
    api.refreshPlaceholder();
    update();
    composers.push(api);
    return api;
  }

    if (state.view === "post") loadPostView(); else loadTimeline();
    loadTrends();
    return true;

  /* =================================================================
     Biblioteca da comunidade: GIFs e figurinhas
     ================================================================= */
  let libKind = "gif", libOnPick = null, libTimer, libItems = [];
  function openLibrary(kind, onPick) {
    libKind = kind; libOnPick = onPick;
    $("#libSearch").value = ""; $("#libAdd").hidden = true; msg("#libMsg", "");
    $$("[data-lib-tab]").forEach((b) => b.classList.toggle("on", b.dataset.libTab === kind));
    openModal($("#libModal"));
    loadLibrary();
  }
  async function loadLibrary() {
    const grid = $("#libGrid");
    $("#libNote").textContent = t(libKind === "gif" ? "libNoteGif" : "libNoteSticker");
    $("#libFile").accept = libKind === "gif" ? "image/gif" : "image/png,image/webp,image/gif";
    grid.innerHTML = '<div class="spinner" style="grid-column:1/-1"></div>';
    const term = cleanQuery($("#libSearch").value);
    let q = sb.from("community_media").select("*").eq("kind", libKind).order("created_at", { ascending: false }).limit(90);
    if (term) q = q.ilike("tags", `%${term}%`);
    const { data, error } = await q;
    let items = (data || []).map((d) => ({ kind: d.kind, url: d.url }));
    if (libKind === "sticker" && !term) items = Object.keys(BUILTIN).map((k) => ({ kind: "sticker", url: k })).concat(items);
    libItems = items;
    if (error && !items.length) { grid.innerHTML = `<p class="muted" style="grid-column:1/-1">${esc(errMsg(t("loadError"), error))}</p>`; return; }
    grid.innerHTML = items.length
      ? items.map((it, i) => `<button class="lib-item ${it.kind}" data-lib-i="${i}"><img src="${esc(mediaSrc(it.url))}" alt="" loading="lazy"></button>`).join("")
      : `<p class="muted" style="grid-column:1/-1;padding:16px 0">${esc(t("libEmpty"))}</p>`;
  }
  $("#libGrid").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lib-i]"); if (!b) return;
    libOnPick && libOnPick(libItems[+b.dataset.libI]);
    closeModal($("#libModal"));
  });
  $$("[data-lib-tab]").forEach((b) => b.addEventListener("click", () => {
    libKind = b.dataset.libTab;
    $$("[data-lib-tab]").forEach((x) => x.classList.toggle("on", x === b));
    loadLibrary();
  }));
  $("#libSearch").addEventListener("input", () => { clearTimeout(libTimer); libTimer = setTimeout(loadLibrary, 300); });
  $("#libAddToggle").addEventListener("click", () => { $("#libAdd").hidden = !$("#libAdd").hidden; if (!$("#libAdd").hidden) $("#libTags").focus(); });
  $("#libPick").addEventListener("click", () => $("#libFile").click());
  $("#libFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    const okType = libKind === "gif" ? f.type === "image/gif" : /^image\/(png|webp|gif)$/.test(f.type);
    if (!okType) return msg("#libMsg", t("libBadType"), "error");
    if (f.size > MAX_GIF_MB * 1048576) return msg("#libMsg", t("fileTooBig", { mb: MAX_GIF_MB }), "error");
    msg("#libMsg", t("uploading"));
    try {
      const ext = f.type === "image/gif" ? "gif" : f.type === "image/png" ? "png" : "webp";
      const url = await uploadFile(f, "community", ext, f.type);
      const tags = $("#libTags").value.trim().slice(0, 80) || null;
      const { error } = await sb.from("community_media").insert({ kind: libKind, url, tags, uploader_id: state.me.id });
      if (error) { removeFiles([url]); throw error; }
      $("#libTags").value = ""; $("#libAdd").hidden = true;
      msg("#libMsg", ""); toast(t("libAdded"));

  /* ---------------- Menu de opções do post ---------------- */
  let dropdown = null;
  function closeDropdown() { dropdown?.remove(); dropdown = null; }
  function openMenu(btn, post) {
    closeDropdown();
    dropdown = document.createElement("div");
    dropdown.className = "dropdown";
    const mine = state.me && post.author_id === state.me.id;
    dropdown.innerHTML = (mine ? `<button class="danger" data-m="delete">${ICONS.trash} ${esc(t("del"))}</button>` : "") +
      `<button data-m="link">${ICONS.link} ${esc(t("copyLink"))}</button>` +
      (post.content ? `<button data-m="copy">${ICONS.copy} ${esc(t("copyText"))}</button>` : "") +
      (!mine ? `<button class="danger" data-m="report">${ICONS.flag} ${esc(t("report"))}</button>` : "");
    document.body.appendChild(dropdown);
    const r = btn.getBoundingClientRect(), w = dropdown.offsetWidth;
    dropdown.style.top = Math.min(r.bottom + 4, innerHeight - dropdown.offsetHeight - 8) + "px";
    dropdown.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    dropdown.addEventListener("click", async (e) => {
      const m = e.target.closest("[data-m]")?.dataset.m;
      closeDropdown();
      if (m === "delete" && confirm(t("confirmDelete"))) {
        const { error } = await sb.from("posts").delete().eq("id", post.id);
        if (error) return toast(errMsg(t("deleteError"), error));
        removeFiles((post.media || []).map((x) => x.url));
        toast(t("deleted"));
        if (state.view === "post" && state.postId === post.id) return goBack();
        state.posts = state.posts.filter((p) => p.id !== post.id);
        if (state.view === "post") loadPostView(); else renderTimeline();
        loadTrends();
      }
      if (m === "copy") copy(post.content, t("copied"));
      if (m === "link") copy(postLink(post.id), t("linkCopied"));
      if (m === "report") openReport(post);
    });
  }
  document.addEventListener("click", (e) => { if (dropdown && !e.target.closest(".dropdown") && !e.target.closest("[data-action=menu]")) closeDropdown(); });
  addEventListener("scroll", closeDropdown, { passive: true });

  function copy(text, okMsg) {

      .then(() => toast(okMsg || t("copied")))
      .catch(() => toast(t("copyFail")));

  async function sharePost(post) {
    const url = postLink(post.id);
    if (navigator.share && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ title: "KOMU", text: (post.content || "").slice(0, 120), url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }

    copy(url, t("linkCopied"));

  /* ---------------- Ações nos posts ---------------- */
  async function toggle(table, set, post, countField) {
    if (!requireAuth()) return null;
    const on = !set.has(post.id);
    on ? set.add(post.id) : set.delete(post.id);
    if (countField) post[countField] += on ? 1 : -1;
    const res = on
      ? await sb.from(table).insert({ post_id: post.id, user_id: state.me.id })
      : await sb.from(table).delete().eq("post_id", post.id).eq("user_id", state.me.id);
    if (res.error && res.error.code !== "23505") {
      on ? set.delete(post.id) : set.add(post.id);
      if (countField) post[countField] += on ? -1 : 1;
      toast(errMsg(t("errGeneric"), res.error));
      return null;
    }
    return on;
  }

  async function goToUsername(username) {
    const { data } = await sb.from("profiles").select("id").eq("username", username.toLowerCase()).maybeSingle();

  $("#timeline").addEventListener("click", async (e) => {
    const lb = e.target.closest("[data-lightbox]");
    if (lb) { $("#lightbox img").src = lb.dataset.lightbox; $("#lightbox").classList.add("open"); return; }
    const tag = e.target.closest("[data-search]");
    if (tag) return go("explore", { query: tag.dataset.search });
    const mention = e.target.closest("[data-username]");
    if (mention) return goToUsername(mention.dataset.username);
    if (e.target.closest("[data-follow], [data-dm], [data-open-settings], [data-open-auth]")) return;
    const userEl = e.target.closest("[data-user]");
    if (userEl) return go("profile", { profileId: userEl.dataset.user });
    if (e.target.id === "loadMore") return loadTimeline(true);
    const convo = e.target.closest("[data-convo]");
    if (convo) { const c = state.convos.find((x) => x.user.id === convo.dataset.convo); if (c) go("messages", { dmWith: c.user }); return; }
    const rp = e.target.closest("[data-action-reply]");
    if (rp) return openCompose(rp.dataset.actionReply);

    const btn = e.target.closest("[data-action]");
    const art = e.target.closest(".post");
    if (!btn) {
      // clicar no post abre a página dele, com as respostas (comentários)
      if (art && !art.classList.contains("main") && !e.target.closest("a, video, button, .sticker") && !String(getSelection())) {
        go("post", { postId: art.dataset.id });
      }
      return;
    }
    const id = art.dataset.id;
    const post = state.posts.find((p) => p.id === id);
    if (!post) return;
    const act = btn.dataset.action;

    if (act === "like" || act === "repost") {
      if (!state.me) return requireAuth();
      const [table, set, field] = act === "like" ? ["likes", state.liked, "like_count"] : ["reposts", state.reposted, "repost_count"];
      const willBeOn = !set.has(id);
      btn.classList.toggle("on", willBeOn);
      btn.lastElementChild.textContent = fmt(post[field] + (willBeOn ? 1 : -1));
      if (act === "like") { btn.classList.remove("pop"); void btn.offsetWidth; if (willBeOn) btn.classList.add("pop"); }
      const result = await toggle(table, set, post, field);
      if (result === null) { btn.classList.toggle("on", set.has(id)); btn.lastElementChild.textContent = fmt(post[field]); }
      else if (act === "repost") toast(t(result ? "reposted" : "unreposted"));
      if (act === "like" && state.view === "liked" && result === false) { state.posts = state.posts.filter((p) => p.id !== id); renderTimeline(); }
    } else if (act === "bookmark") {
      if (!state.me) return requireAuth();
      const result = await toggle("bookmarks", state.bookmarked, post);
      if (result === null) return;
      btn.classList.toggle("on", result);
      toast(t(result ? "saved" : "unsaved"));
      if (state.view === "bookmarks" && !result) { state.posts = state.posts.filter((p) => p.id !== id); renderTimeline(); }
    } else if (act === "reply") {
      openCompose(id);
    } else if (act === "share") {
      sharePost(post);
    } else if (act === "menu") {
      e.stopPropagation(); openMenu(btn, post);
    }
  });

  /* ---------------- Seguir / pedir para seguir / mensagem ---------------- */
  document.addEventListener("click", async (e) => {
    const dm = e.target.closest("[data-dm]");
    if (dm) return startDM(dm.dataset.dm);
    const b = e.target.closest("[data-follow]");
    if (!b) return;
    if (!requireAuth()) return;
    const id = b.dataset.follow;
    const current = state.following.get(id);
    b.disabled = true;
    let status = null, error = null;
    if (current) {
      ({ error } = await sb.from("follows").delete().eq("follower_id", state.me.id).eq("following_id", id));
    } else {
      const res = await sb.from("follows").insert({ follower_id: state.me.id, following_id: id }).select("status").single();
      error = res.error && res.error.code !== "23505" ? res.error : null;
      status = (res.data && res.data.status) || "accepted";
    }
    b.disabled = false;
    if (error) return toast(errMsg(t("errGeneric"), error));
    if (current) state.following.delete(id); else state.following.set(id, status);
    if (status === "pending") toast(t("requestSent"));
    renderFollow();

    if (state.view === "profile" && state.profileId === id) {
      const before = state.profile && state.profile.canSee;
      await loadProfile();
      if (state.profile && state.profile.canSee !== before) loadTimeline();
    }
    if (state.view === "home" && state.tab === "following") loadTimeline();
  });

  /* ---------------- Busca (no Explorar) ---------------- */
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.query = e.target.value; loadTimeline(); }, 300);
  });

  /* ---------------- Eventos gerais ---------------- */
  document.addEventListener("click", (e) => {
    if (e.target.closest("#timeline")) {
      if (e.target.closest("[data-open-auth]")) openAuth();
      if (e.target.closest("[data-open-settings]")) openSettings();
      return;
    }
    const g = e.target.closest("[data-go]");
    if (g) { go(g.dataset.go); return; }
    if (e.target.closest("[data-open-auth]")) return openAuth();
    if (e.target.closest("[data-open-settings]")) return openSettings();
    if (e.target.closest("[data-open-compose]")) return openCompose();
    const lb = e.target.closest("[data-lang]"); if (lb) return setLang(lb.dataset.lang);
    const tr = e.target.closest("#trends [data-search]"); if (tr) return go("explore", { query: tr.dataset.search });
    const u = e.target.closest("#whoToFollow [data-user]"); if (u) return go("profile", { profileId: u.dataset.user });
  });
  $$("[data-tab]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderNav(); loadTimeline(); }));
  $("#mobileMe").addEventListener("click", () => (state.me ? go("me") : requireAuth()));
  $("#backBtn").addEventListener("click", goBack);
  $("#newPosts").addEventListener("click", () => { state.pending = 0; renderNewPosts(); window.scrollTo({ top: 0 }); loadTimeline(); });

  /* ---------------- Tema (padrão: escuro) ---------------- */
  const savedTheme = ls.get("komu:theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;

  setInterval(() => { if (state.me && state.view !== "notifications") loadNotifCount(); }, 60000);
  setInterval(() => $$("#timeline time").forEach((el) => (el.textContent = timeAgo(Date.parse(el.getAttribute("datetime"))))), 60000);

  /* ---------------- Início ---------------- */
  async function init() {
    applyI18n();
    setAuthMode("login");
    renderAll();
    if (!sb) return;

    await syncAuth();
    renderAll();
    const pid = new URLSearchParams(location.search).get("post");
    if (pid) go("post", { postId: pid }, true); else loadTimeline();
    loadTrends(); loadWhoToFollow();
    sb.auth.onAuthStateChange(() => { setTimeout(syncAuth, 0); });
  }
  init();
})();
</script>
</body>
</html>
