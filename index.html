    --bg: #ffffff;
    --bg-soft: #f4f4f4;
    --bg-hover: rgba(0, 0, 0, 0.04);
    --border: #e6e6e6;
    --text: #0a0a0a;
    --text-muted: #6b6b6b;
    --accent: #a20e0c;
    --accent-hover: #870b0a;
    --accent-soft: rgba(162, 14, 12, 0.1);
    --on-accent: #ffffff;
    --danger: #a20e0c;
    --ok: #138a4b;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --bg-soft: #141414;
    --bg-hover: rgba(255, 255, 255, 0.05);
    --border: #262626;
    --text: #ffffff;
    --text-muted: #8a8a8a;
    --accent: #e3261f;
    --accent-hover: #f0403a;
    --accent-soft: rgba(227, 38, 31, 0.16);
    --danger: #ff4a43;
    --ok: #3ccf7f;
    --shadow: 0 8px 28px rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", "Noto Color Emoji", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font: inherit; }
  svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: 275px minmax(0, 600px) 340px; justify-content: center; min-height: 100vh; }

  /* ---------- Logo (máscara: assume a cor do tema) ---------- */
  .mark, .wordmark { display: block; background-color: currentColor; -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }
  .mark { -webkit-mask-image: var(--icon); mask-image: var(--icon); }
  .wordmark { -webkit-mask-image: var(--logo); mask-image: var(--logo); aspect-ratio: 669 / 188; }

  /* ---------- Navegação lateral ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 8px 12px 16px; gap: 2px; overflow-y: auto; }
  .logo { display: flex; align-items: center; height: 56px; padding: 0 14px; border-radius: 999px; color: var(--accent); width: fit-content; }
  .logo:hover { background: var(--accent-soft); }
  .logo .wordmark { width: 130px; }
  .logo .mark { display: none; width: 30px; height: 30px; }

  /* Meu perfil no topo: abre o próprio perfil; a engrenagem abre as configurações */
  .me-top { display: flex; align-items: center; gap: 4px; margin: 6px 0 10px; padding: 4px; border: 1px solid var(--border); border-radius: 999px; }
  .me-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; border-radius: 999px; text-align: left; }
  .me-link:hover { background: var(--bg-hover); }
  .me-link .names { min-width: 0; }
  .me-link .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-link small { color: var(--text-muted); font-size: 13px; }
  .me-login { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; font-weight: 700; text-align: left; }
  .me-login:hover { background: var(--bg-hover); }
  .me-login svg { width: 22px; height: 22px; flex-shrink: 0; }
  .gear-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; color: var(--text-muted); }
  .gear-btn:hover { background: var(--bg-hover); color: var(--text); }
  .gear-btn svg { width: 22px; height: 22px; }

  .nav-item { display: flex; align-items: center; gap: 18px; padding: 11px 16px; border-radius: 999px; font-size: 19px; width: fit-content; transition: background .15s; white-space: nowrap; }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { font-weight: 700; }
  .nav-item.active svg { color: var(--accent); }
  .nav-item svg { width: 26px; height: 26px; }
  .nav-ico { position: relative; display: inline-flex; }
  .nav-badge { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); line-height: 1; }

  .btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 0 20px; height: 40px; transition: background .15s, opacity .15s; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-outline { border: 1px solid var(--border); font-weight: 700; border-radius: 999px; padding: 0 18px; height: 36px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-outline:hover { background: var(--bg-hover); }
  .btn-outline.danger { color: var(--danger); }
  .btn-outline svg { width: 18px; height: 18px; }
  .btn-sm { height: 32px; padding: 0 14px; font-size: 14px; }
  .btn-post-big { width: 90%; height: 52px; font-size: 17px; margin-top: 14px; }
  .av-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
  .badge-dot { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }

  /* ---------- Coluna central ---------- */
  .feed { border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; }
  .feed-header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .feed-header h1 { font-size: 20px; font-weight: 800; padding: 12px 16px; display: flex; align-items: center; gap: 14px; min-height: 56px; }
  .feed-header h1 #viewTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; }
  .tab { flex: 1; padding: 16px 0; color: var(--text-muted); font-weight: 500; position: relative; transition: background .15s; }
  .tab:hover { background: var(--bg-hover); }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 56px; height: 4px; border-radius: 4px; background: var(--accent); }
  .explore-search { padding: 0 16px 12px; }
  .explore-search label { display: flex; align-items: center; gap: 12px; background: var(--bg-soft); border: 1px solid transparent; border-radius: 999px; padding: 0 16px; height: 44px; color: var(--text-muted); }
  .explore-search label:focus-within { border-color: var(--accent); background: var(--bg); color: var(--accent); }
  .explore-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); min-width: 0; }
  .explore-search input::placeholder { color: var(--text-muted); }
  .section-title { font-size: 17px; font-weight: 800; padding: 14px 16px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 14px; border-bottom: 1px solid var(--border); }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); font-weight: 600; font-size: 14px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; user-select: none; background: #444; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clickable { cursor: pointer; }

  /* ---------- Composer ---------- */
  .composer { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
  .composer-body { flex: 1; min-width: 0; }
  .composer textarea { width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text); font-size: 20px; line-height: 1.35; min-height: 56px; padding: 8px 0; }
  .composer textarea::placeholder { color: var(--text-muted); }
  .composer-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; gap: 8px; }
  .composer-tools { display: flex; gap: 0; color: var(--accent); flex-wrap: wrap; }
  .composer-tools button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .composer-tools button:hover, .composer-tools button.open { background: var(--accent-soft); }
  .composer-tools button:disabled { opacity: .4; cursor: default; background: none; }
  .composer-tools .txt-ico { font-size: 11px; font-weight: 800; border: 1.8px solid currentColor; border-radius: 4px; padding: 1px 3px; line-height: 1; }
  .composer-actions { display: flex; align-items: center; gap: 12px; }
  .counter { position: relative; width: 26px; height: 26px; }
  .counter svg { width: 26px; height: 26px; transform: rotate(-90deg); stroke-width: 2.5; }
  .counter .track { stroke: var(--border); }
  .counter .bar { stroke: var(--text); transition: stroke-dashoffset .15s, stroke .15s; }
  .counter span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--text-muted); }
  .counter.warn .bar, .counter.over .bar { stroke: var(--accent); }
  .counter.over span { color: var(--accent); }
  .reply-context { font-size: 14px; color: var(--text-muted); padding-bottom: 4px; }
  .reply-context b { color: var(--accent); font-weight: 500; }
  .att-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
  .att { position: relative; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--bg-soft); border: 1px solid var(--border); }
  .att img, .att video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att.sticker img { object-fit: contain; }
  .att .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; display: grid; place-items: center; }
  .att .x svg { width: 14px; height: 14px; }
  .att .tag { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.7); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 4px; }
  .composer-msg { font-size: 13px; color: var(--danger); padding-top: 4px; }

  /* ---------- Emojis e @ ---------- */
  .emoji-picker { position: fixed; z-index: 70; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; width: 304px; max-width: calc(100vw - 16px); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .emoji-picker button { aspect-ratio: 1; border-radius: 8px; font-size: 22px; line-height: 1; display: grid; place-items: center; font-family: "Noto Color Emoji", sans-serif; }
  .emoji-picker button:hover { background: var(--bg-hover); }
  .emoji-picker .label { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 4px 4px 6px; }
  .emoji-picker .label + .emoji-grid { margin-bottom: 6px; }
  .mention-box { position: fixed; z-index: 70; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); width: 280px; max-width: calc(100vw - 16px); overflow: hidden; }
  .mention-box button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; text-align: left; }
  .mention-box button.sel, .mention-box button:hover { background: var(--bg-hover); }
  .mention-box .avatar { width: 32px; height: 32px; font-size: 13px; }
  .mention-box .names { min-width: 0; }
  .mention-box .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .login-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border-bottom: 1px solid var(--border); }
  .login-cta p { color: var(--text-muted); }
  .login-cta strong { display: block; color: var(--text); font-size: 17px; }
  .new-posts { display: none; width: 100%; padding: 14px; color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--border); }
  .new-posts.show { display: block; }
  .new-posts:hover { background: var(--bg-hover); }

  /* ---------- Perfil ---------- */
  .profile-head { border-bottom: 1px solid var(--border); }
  .profile-cover { height: 180px; background: linear-gradient(135deg, var(--accent), #000) center / cover no-repeat; }
  .profile-info { padding: 0 16px 16px; }
  .profile-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -52px; gap: 8px; }
  .profile-row > .avatar { width: 112px; height: 112px; font-size: 40px; border: 4px solid var(--bg); }
  .profile-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .profile-info h2 { font-size: 20px; font-weight: 800; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .profile-stats { display: flex; gap: 20px; margin-top: 10px; color: var(--text-muted); }
  .profile-stats b { color: var(--text); }
  .lock { display: inline-flex; color: var(--text-muted); }
  .lock svg { width: 15px; height: 15px; }
  h2 .lock svg { width: 18px; height: 18px; }
  .icon-round { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; }
  .icon-round:hover { background: var(--bg-hover); }
  .icon-round svg { width: 19px; height: 19px; }

  /* ---------- Posts ---------- */
  .post { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background .15s; animation: fadeIn .25s ease; cursor: pointer; }
  .post:hover { background: var(--bg-hover); }
  .post.main { cursor: default; }
  .post.main:hover { background: none; }
  .post.main .post-text { font-size: 19px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .post-body { flex: 1; min-width: 0; }
  .post-meta { display: flex; align-items: center; gap: 4px; color: var(--text-muted); white-space: nowrap; overflow: hidden; }
  .post-meta .name { color: var(--text); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .post-meta .name:hover, .post-meta .handle:hover { text-decoration: underline; }
  .post-meta .handle { overflow: hidden; text-overflow: ellipsis; }
  .post-menu { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text-muted); flex-shrink: 0; }
  .post-menu:hover { background: var(--accent-soft); color: var(--accent); }
  .post-wrap { border-bottom: 1px solid var(--border); padding-top: 8px; }
  .post-wrap .post { border-bottom: none; padding-top: 0; }
  .reposted-by, .notif-label { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 0 0 4px 44px; }
  .reposted-by svg, .notif-label svg { width: 15px; height: 15px; }
  .notif-label svg { color: var(--accent); }
  .post-text { white-space: pre-wrap; word-wrap: break-word; margin: 2px 0 10px; }
  .post-text:empty { display: none; }
  .post-text .tag, .post-text .mention { color: var(--accent); cursor: pointer; }
  .post-text .mention:hover, .post-text .tag:hover { text-decoration: underline; }
  .post-text a.link { color: var(--accent); text-decoration: none; }
  .post-text a.link:hover { text-decoration: underline; }
  .replying-to { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
  .replying-to .mention { color: var(--accent); cursor: pointer; }
  .replying-to .mention:hover { text-decoration: underline; }
  .media-grid { display: grid; gap: 2px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); margin: 4px 0 10px; }
  .media-grid > div { min-height: 0; position: relative; }
  .media-grid img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; background: var(--bg-soft); }
  .media-grid.n1 img { max-height: 520px; height: auto; }
  .media-grid.n2 { grid-template-columns: 1fr 1fr; aspect-ratio: 16 / 9; }
  .media-grid.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9; }
  .media-grid.n3 > div:first-child { grid-row: span 2; }
  .media-grid.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9; }
  .media-video { width: 100%; max-height: 520px; border-radius: 16px; background: #000; display: block; margin: 4px 0 10px; border: 1px solid var(--border); }
  .media-gif::after { content: "GIF"; position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  .sticker { width: 160px; height: 160px; object-fit: contain; display: block; margin: 4px 0 10px; }

  .actions { display: flex; justify-content: space-between; max-width: 425px; margin-left: -8px; }
  .action { display: flex; align-items: center; gap: 2px; color: var(--text-muted); font-size: 13px; }
  .action .icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
  .action svg { width: 18px; height: 18px; }
  .action:hover, .action.on { color: var(--accent); }
  .action:hover .icon { background: var(--accent-soft); }
  .action.like.on svg, .action.bookmark.on svg { fill: currentColor; }
  .action.repost.on svg { stroke-width: 2.6; }
  .action.like.pop svg { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .reply-prompt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); text-align: left; font-size: 17px; }
  .reply-prompt:hover { background: var(--bg-hover); }
  .reply-prompt .btn-primary { margin-left: auto; height: 36px; font-size: 15px; display: grid; place-items: center; padding: 0 16px; }

  .notif-follow, .person { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background .15s; }
  .notif-follow:hover, .person:hover { background: var(--bg-hover); }
  .notif-follow .nf-icon { width: 40px; display: flex; justify-content: center; color: var(--accent); flex-shrink: 0; }
  .notif-follow .nf-icon svg { width: 26px; height: 26px; }
  .notif-follow .nf-body, .person .names { flex: 1; min-width: 0; }
  .notif-follow .nf-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .notif-follow .nf-text { margin-top: 6px; }
  .person { align-items: center; }
  .person .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-banner { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-bottom: 1px solid var(--border); text-align: left; font-weight: 600; }
  .req-banner:hover { background: var(--bg-hover); }
  .req-banner svg { color: var(--accent); width: 22px; height: 22px; }

  .empty { padding: 48px 32px; text-align: center; color: var(--text-muted); }
  .empty h2 { color: var(--text); font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .empty .btn-primary { margin-top: 20px; }
  .empty .big-ico { color: var(--text); margin-bottom: 12px; }
  .empty .big-ico svg { width: 40px; height: 40px; }
  .setup { padding: 32px 24px; line-height: 1.6; }
  .setup h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .spinner { width: 28px; height: 28px; margin: 32px auto; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .spinner.sm { width: 20px; height: 20px; margin: 8px 16px; border-width: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-more { display: block; width: 100%; padding: 16px; color: var(--accent); font-weight: 600; }
  .load-more:hover { background: var(--bg-hover); }

  /* ---------- Mensagens ---------- */
  .convo { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-bottom: 1px solid var(--border); text-align: left; }
  .convo:hover { background: var(--bg-hover); }
  .convo .names { flex: 1; min-width: 0; }
  .convo .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .last { color: var(--text-muted); font-size: 14px; }
  .convo.unread .last { color: var(--text); font-weight: 600; }
  .convo .unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .thread { display: flex; flex-direction: column; min-height: calc(100vh - 57px); }
  .thread-head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 16px; border-bottom: 1px solid var(--border); text-align: center; }
  .thread-head .avatar { width: 64px; height: 64px; font-size: 24px; }
  .bubbles { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 20px; background: var(--bg-soft); align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-left-radius: 20px; border-bottom-right-radius: 6px; }
  .bubble.me .mention, .bubble.me .tag, .bubble.me a { color: inherit; text-decoration: underline; }
  .bubble-time { font-size: 12px; color: var(--text-muted); margin: 2px 4px 8px; }
  .bubble-time.me { align-self: flex-end; }
  .dm-input { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg); }
  .dm-input textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 20px; padding: 10px 14px; background: var(--bg-soft); color: var(--text); outline: none; max-height: 140px; min-height: 42px; }
  .dm-input textarea:focus { border-color: var(--accent); }
  .dm-input .btn-primary { height: 42px; }

  /* ---------- Coluna direita ---------- */
  .aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 12px 0 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .panel h2 { font-size: 20px; font-weight: 800; padding: 12px 16px; }
  .trend { display: block; width: 100%; text-align: left; padding: 12px 16px; transition: background .15s; }
  .trend:hover, .follow:hover { background: var(--bg-hover); }
  .trend small { color: var(--text-muted); font-size: 13px; display: block; }
  .trend b { display: block; margin: 2px 0; }
  .follow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; transition: background .15s; }
  .follow .names { flex: 1; min-width: 0; text-align: left; }
  .follow .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-follow { background: var(--text); color: var(--bg); font-weight: 700; border-radius: 999px; padding: 0 16px; height: 32px; font-size: 14px; flex-shrink: 0; }
  .btn-follow.following { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-follow.following:hover { border-color: var(--accent); color: var(--accent); }
  .muted { color: var(--text-muted); }
  .footer-links { font-size: 13px; color: var(--text-muted); padding: 0 16px; line-height: 1.8; }

  /* ---------- Modais ---------- */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(60, 60, 60, 0.5); display: none; align-items: flex-start; justify-content: center; padding: 5vh 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 16px; box-shadow: var(--shadow); }
  .modal-top { display: flex; align-items: center; gap: 12px; padding: 8px; }
  .modal-top.sticky { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .modal-top strong { font-size: 19px; flex: 1; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-hover); }
  .modal .composer { border-bottom: none; padding-top: 4px; }
  .modal .quoted { padding: 0 16px; }
  .modal .quoted .post { padding: 4px 0 8px; border: none; cursor: default; }
  .modal .quoted .post:hover { background: none; }
  .thread-line { width: 2px; background: var(--border); margin: 4px auto 0; flex: 1; min-height: 16px; }
  .field { padding: 8px 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); outline: none; }
  .field textarea { resize: vertical; min-height: 80px; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field input[readonly] { color: var(--text-muted); }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; outline: 1px solid var(--border); }
  .colors button.on { border-color: var(--bg); outline: 2px solid var(--text); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 16px 16px; }
  .form-msg { min-height: 20px; font-size: 14px; color: var(--text-muted); padding-top: 4px; }
  .form-msg.error { color: var(--danger); }
  .form-msg.ok { color: var(--ok); }

  .auth-box { padding: 0 24px 16px; }
  .auth-box .wordmark { width: 150px; margin: 4px auto 16px; color: var(--accent); }
  .auth-box h2 { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 16px; }
  .auth-box .field { padding: 8px 0; }
  .auth-box .modal-footer { padding: 12px 0 0; }
  .auth-box .modal-footer .btn-primary { width: 100%; height: 48px; font-size: 16px; }
  .auth-box .lead { text-align: center; color: var(--text-muted); margin: -8px 0 12px; }
  .auth-box .big-ico { display: flex; justify-content: center; color: var(--accent); margin-bottom: 8px; }
  .auth-box .big-ico svg { width: 48px; height: 48px; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .auth-tabs button { flex: 1; padding: 12px; color: var(--text-muted); font-weight: 600; position: relative; }
  .auth-tabs button.on { color: var(--text); }
  .auth-tabs button.on::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); }
  #authForm[data-mode="login"] .signup-only { display: none; }
  .pw-rules { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 13px; color: var(--text-muted); padding: 6px 0 0; }
  .pw-rules li::before { content: "✗ "; color: var(--danger); font-weight: 700; }
  .pw-rules li.ok { color: var(--ok); }
  .pw-rules li.ok::before { content: "✓ "; color: var(--ok); }
  .auth-lang { display: flex; justify-content: center; padding-top: 16px; }
  .code-input { letter-spacing: .45em; font-size: 22px !important; text-align: center; font-variant-numeric: tabular-nums; }
  .link-btn { color: var(--text-muted); font-size: 14px; font-weight: 600; text-decoration: underline; display: block; margin: 12px auto 0; }
  .link-btn:disabled { opacity: .5; cursor: default; }

  /* Configurações */
  .edit-cover { height: 170px; background: linear-gradient(135deg, var(--accent), #000) center / cover no-repeat; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .cam { width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; display: grid; place-items: center; transition: background .15s; }
  .cam:hover { background: rgba(0, 0, 0, .75); }
  .cam svg { width: 22px; height: 22px; }
  .edit-avatar { position: relative; width: 112px; height: 112px; margin: -56px 0 0 16px; }
  .edit-avatar .avatar { width: 112px; height: 112px; font-size: 40px; border: 4px solid var(--bg); }
  .edit-avatar .cam { position: absolute; inset: 0; margin: auto; }
  .media-links { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 16px 0; }
  .media-links button { color: var(--danger); font-size: 14px; font-weight: 600; }
  .st-section { border-top: 1px solid var(--border); margin-top: 12px; padding: 4px 0 8px; }
  .st-section h3 { font-size: 17px; font-weight: 800; padding: 12px 16px 4px; }
  .st-text { padding: 0 16px; color: var(--text-muted); font-size: 14px; }
  .st-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; flex-wrap: wrap; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; cursor: pointer; }
  .switch-row p { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
  .switch { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(20px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .req-title { font-weight: 700; padding: 12px 16px 4px; font-size: 15px; }
  .req-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .req-row .names { flex: 1; min-width: 0; }
  .req-row .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-row .btns { display: flex; gap: 8px; }
  .twofa, .pwbox { padding: 0 16px; }
  .pwbox { padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px dashed var(--border); }
  .twofa p, .pwbox p { color: var(--text-muted); font-size: 14px; margin: 4px 0 10px; }
  .twofa .status-on { color: var(--ok); font-weight: 700; display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .twofa .status-on svg { width: 18px; height: 18px; }
  .qr { width: 184px; height: 184px; background: #fff; padding: 8px; border-radius: 10px; display: block; margin: 4px 0 10px; }
  .secret { display: inline-block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--bg-soft); padding: 6px 10px; border-radius: 6px; word-break: break-all; margin-bottom: 10px; user-select: all; }
  .twofa .field, .pwbox .field { padding: 4px 0; max-width: 320px; }
  .twofa .btns, .pwbox .btns { display: flex; gap: 8px; margin-top: 8px; }
  .sub-title { font-weight: 700; margin-top: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .seg button { padding: 6px 16px; border-radius: 999px; font-weight: 600; color: var(--text-muted); font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }

  /* Denúncia */
  .report-list { padding: 0 16px; display: grid; gap: 2px; }
  .report-list label { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px; cursor: pointer; }
  .report-list label:hover { background: var(--bg-hover); }
  .report-list input { accent-color: var(--accent); width: 18px; height: 18px; }
  .report-intro { padding: 0 16px 8px; color: var(--text-muted); }

  /* Biblioteca de GIFs e figurinhas */
  .lib-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .lib-tabs button { flex: 1; padding: 12px; color: var(--text-muted); font-weight: 600; position: relative; }
  .lib-tabs button.on { color: var(--text); }
  .lib-tabs button.on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); }
  .lib-bar { display: flex; gap: 8px; padding: 12px 16px; align-items: center; }
  .lib-bar input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--text); outline: none; }
  .lib-bar input:focus { border-color: var(--accent); }
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; padding: 0 16px 16px; }
  .lib-item { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg-soft); border: 2px solid transparent; }
  .lib-item:hover { border-color: var(--accent); }
  .lib-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lib-item.sticker img { object-fit: contain; padding: 6px; }
  .lib-add { padding: 0 16px 12px; display: grid; gap: 8px; }
  .lib-add .row { display: flex; gap: 8px; }
  .lib-add input[type=text] { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); outline: none; }
  .lib-note { padding: 0 16px 8px; font-size: 13px; color: var(--text-muted); }

  .lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .dropdown { position: fixed; z-index: 40; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-width: 200px; overflow: hidden; }
  .dropdown button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; font-weight: 700; text-align: left; }
  .dropdown button:hover { background: var(--bg-hover); }
  .dropdown .danger { color: var(--danger); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 8px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 95; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ---------- Responsivo ---------- */
  .bottom-nav, .fab, .mobile-me, .mobile-gear { display: none; }
  @media (max-width: 1260px) {
    .app { grid-template-columns: 88px minmax(0, 600px) 340px; }
    .nav-item > span:last-child:not(.nav-ico), .btn-post-big .label, .me-link .names, .me-login span { display: none; }
    .sidebar { align-items: center; }
    .logo { width: 52px; height: 52px; padding: 0; justify-content: center; }
    .logo .wordmark { display: none; }
    .logo .mark { display: block; }
    .me-top { flex-direction: column; border: none; padding: 0; }
    .me-link, .me-login { flex: none; padding: 4px; }
    .nav-item { padding: 11px; }
    .btn-post-big { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; }
    .btn-post-big .ico { display: block !important; }
  }
  @media (max-width: 1020px) {
    .app { grid-template-columns: 88px minmax(0, 600px); }
    .aside { display: none; }
  }
  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
    .feed { border: none; padding-bottom: 64px; }
    .feed-header h1 { padding: 8px 12px; min-height: 52px; }
    .mobile-me { display: inline-flex; }
    .mobile-me .avatar { width: 32px; height: 32px; font-size: 13px; }
    .mobile-gear { display: grid; }
    .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--border); justify-content: space-around; height: 54px; padding-bottom: env(safe-area-inset-bottom); box-sizing: content-box; }
    .bottom-nav button { flex: 1; display: grid; place-items: center; }
    .bottom-nav button.active { color: var(--accent); }
    .bottom-nav svg { width: 26px; height: 26px; }
    .fab { display: grid; place-items: center; position: fixed; right: 16px; bottom: 70px; z-index: 21; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); }
    .fab svg { width: 24px; height: 24px; }
    .composer textarea { font-size: 17px; }
    .composer { padding: 12px; }
    .composer-tools { flex-wrap: nowrap; }
    .composer-tools button { width: 32px; height: 32px; }
    .modal-backdrop { padding: 0; }
    .modal { border-radius: 0; min-height: 100vh; max-height: none; max-width: none; }
    .profile-cover, .edit-cover { height: 130px; }
    .thread { min-height: calc(100vh - 53px - 54px); }
    .dm-input { bottom: 54px; }
    body.in-thread .fab { display: none; }
    .pw-rules { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" aria-label="KOMU">
    <button class="logo" data-go="home" data-i18n-aria="home"><span class="wordmark"></span><span class="mark"></span></button>

    <!-- Meu perfil (abre o próprio perfil) + engrenagem (configurações) -->
    <div class="me-top" id="meTop"></div>

    <button class="nav-item" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="home"></span></button>
    <button class="nav-item" data-go="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-i18n="explore"></span></button>
    <button class="nav-item" data-go="notifications"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="nav-badge" data-notif-badge hidden></span></span><span data-i18n="notifications"></span></button>
    <button class="nav-item" data-go="messages"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="nav-badge" data-dm-badge hidden></span></span><span data-i18n="messages"></span></button>
    <button class="nav-item" data-go="bookmarks"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-i18n="bookmarks"></span></button>
    <button class="nav-item" data-go="liked"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-i18n="liked"></span></button>
    <button class="btn-primary btn-post-big" data-open-compose data-i18n-aria="post">
      <span class="label" data-i18n="post"></span>
      <svg class="ico" viewBox="0 0 24 24" style="display:none"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <main class="feed">
    <header class="feed-header">
      <h1>
        <button class="mobile-me av-wrap" id="mobileMe" data-i18n-aria="myProfile"><span class="avatar" data-me-avatar>?</span><span class="badge-dot" data-req-dot hidden></span></button>
        <button class="icon-btn" id="backBtn" data-i18n-aria="back" hidden><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <span id="viewTitle"></span>
        <button class="icon-btn mobile-gear" data-open-settings data-i18n-aria="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </h1>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="foryou" data-i18n="forYou"></button>
        <button class="tab" data-tab="following" data-i18n="followingTab"></button>
      </div>
      <div class="explore-search" id="exploreSearch" hidden>
        <label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search" data-i18n-ph="searchPh" enterkeyhint="search"></label>
      </div>
    </header>

    <div id="profileHead"></div>

    <div class="login-cta" id="loginCta" hidden>
      <p><strong data-i18n="ctaTitle"></strong><span data-i18n="ctaText"></span></p>
      <button class="btn-primary" data-open-auth data-i18n="login"></button>
    </div>

    <div class="composer" id="inlineComposer" hidden></div>

    <button class="new-posts" id="newPosts"></button>
    <section id="timeline" aria-live="polite"></section>
  </main>

  <aside class="aside">
    <div class="panel"><h2 data-i18n="trendsTitle"></h2><div id="trends"></div></div>
    <div class="panel"><h2 data-i18n="whoToFollow"></h2><div id="whoToFollow"></div></div>
    <p class="footer-links" data-i18n="footer"></p>
  </aside>
</div>

<nav class="bottom-nav" aria-label="KOMU">
  <button data-go="home" data-i18n-aria="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-go="explore" data-i18n-aria="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  <button data-go="notifications" data-i18n-aria="notifications"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="nav-badge" data-notif-badge hidden></span></span></button>
  <button data-go="messages" data-i18n-aria="messages"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="nav-badge" data-dm-badge hidden></span></span></button>
  <button data-go="me" data-i18n-aria="myProfile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></button>
</nav>
<button class="fab" data-open-compose data-i18n-aria="post"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- Modelo do composer (usado no feed e no modal) -->
<template id="composerTpl">
  <span class="avatar" data-me-avatar></span>
  <div class="composer-body">
    <div class="reply-context" hidden></div>
    <textarea maxlength="400"></textarea>
    <div class="att-strip" hidden></div>
    <div class="composer-msg" hidden></div>
    <div class="composer-footer">
      <div class="composer-tools">
        <button type="button" data-media-btn data-i18n-aria="addMedia"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
        <button type="button" data-lib-btn="gif" data-i18n-aria="gifs"><span class="txt-ico">GIF</span></button>
        <button type="button" data-lib-btn="sticker" data-i18n-aria="stickers"><svg viewBox="0 0 24 24"><path d="M15 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6a3 3 0 0 0-3-3z"/><path d="M13 21v-5a3 3 0 0 1 3-3h5"/><path d="M8.5 10h.01M14.5 10h.01"/></svg></button>
        <button type="button" data-emoji-btn data-i18n-aria="emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>
        <button type="button" data-insert="@" data-i18n-aria="mention"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button>
        <button type="button" data-insert="#" data-i18n-aria="hashtag"><svg viewBox="0 0 24 24"><path d="M5 9h15M4 15h15M10 3 8 21M16 3l-2 18"/></svg></button>
      </div>
      <div class="composer-actions">
        <div class="counter"><svg viewBox="0 0 26 26"><circle class="track" cx="13" cy="13" r="10" fill="none"/><circle class="bar" cx="13" cy="13" r="10" fill="none" stroke-dasharray="62.83" stroke-dashoffset="62.83"/></svg><span></span></div>
        <button class="btn-primary" data-submit disabled data-i18n="post"></button>
      </div>
    </div>
    <input type="file" data-file accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" multiple hidden>
  </div>
</template>

<!-- Modal: novo post / resposta -->
<div class="modal-backdrop" id="composeModal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-top"><button class="icon-btn" data-close data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="quoted" id="quoted"></div>
    <div class="composer" id="modalComposer"></div>
  </div>
</div>

<!-- Modal: entrar / criar conta / confirmar e-mail / código 2FA -->
<div class="modal-backdrop" id="authModal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-top"><button class="icon-btn" data-close data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="auth-box">
      <span class="wordmark" role="img" aria-label="KOMU"></span>

      <div id="authStepForm">
        <h2 id="authTitle"></h2>
        <div class="auth-tabs">
          <button type="button" data-auth="login" class="on" data-i18n="login"></button>
          <button type="button" data-auth="signup" data-i18n="signup"></button>
        </div>
        <form id="authForm" data-mode="login" novalidate>
          <div class="field signup-only"><label for="auName" data-i18n="name"></label><input id="auName" maxlength="40" autocomplete="name"></div>
          <div class="field signup-only"><label for="auUser" data-i18n="username"></label><input id="auUser" maxlength="20" data-i18n-ph="usernamePh" autocomplete="username"></div>
          <div class="field"><label for="auEmail" data-i18n="email"></label><input id="auEmail" type="email" autocomplete="email"></div>
          <div class="field"><label for="auPass" data-i18n="password"></label><input id="auPass" type="password" autocomplete="current-password">
            <ul class="pw-rules signup-only" id="pwRules"></ul>
          </div>
          <p class="form-msg" id="authMsg"></p>
          <button type="button" class="link-btn" id="resendFromLogin" data-i18n="resendEmail" hidden></button>
          <div class="modal-footer"><button class="btn-primary" type="submit" id="authSubmit"></button></div>
        </form>
      </div>

      <div id="authStepCheck" hidden>
        <div class="big-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
        <h2 data-i18n="checkTitle"></h2>
        <p class="lead" id="checkText"></p>
        <p class="form-msg" id="checkMsg" style="text-align:center"></p>
        <div class="modal-footer"><button class="btn-primary" type="button" id="checkDone" data-i18n="checkDone"></button></div>
        <button type="button" class="link-btn" id="checkResend" data-i18n="resendEmail"></button>
      </div>

      <div id="authStepMfa" hidden>

  const initials = (name = "?") => name.trim().split(/\s+/).slice(0, 2).map((p) => [...p][0]).join("").toUpperCase() || "?";
  const fmt = (n) => {
    const k = lang === "pt" ? [" mi", " mil"] : ["M", "K"];
    return n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + k[0] : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".0", "") + k[1] : n ? String(n) : "";

  const min = 60e3, hour = 60 * min, day = 24 * hour;
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < min) return t("now");
    if (d < hour) return t("unitMin", { n: Math.floor(d / min) });
    if (d < day) return t("unitH", { n: Math.floor(d / hour) });
    return new Date(ts).toLocaleDateString(locale(), { day: "numeric", month: "short" }).replace(".", "");
  }

  let toastTimer;
  function toast(text) {
    const el = $("#toast");
    el.textContent = text; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }
  function errMsg(base, e) {
    const m = (e && (e.message || e.error_description || e.error || e.msg)) || "";
    if (/bucket not found/i.test(m)) return t("errNoBucket");
    if ((e && ["42703", "PGRST204", "42P01", "PGRST200", "PGRST205"].includes(e.code)) || /column .* does not exist|schema cache|relation .* does not exist/i.test(m)) return t("errDbOutdated");
    if (/mfa|totp|factor/i.test(m) && /disabled|not enabled/i.test(m)) return t("errMfaOff");
    if (/payload too large|maximum allowed size|too large/i.test(m)) return t("fileTooBig", { mb: MAX_VIDEO_MB });
    if (/mime type|invalid_mime/i.test(m)) return t("badFile");
    return m ? `${base} (${m})` : base;
  }
  function msg(sel, text, kind) {
    const m = typeof sel === "string" ? $(sel) : sel; if (!m) return;
    m.textContent = text; m.classList.toggle("error", kind === "error"); m.classList.toggle("ok", kind === "ok");
  }

  /* =================================================================
     Idioma e tema
     ================================================================= */
  function applyI18n() {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    $$("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    $$("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
    $$("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria); });
    $$("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  }
  function setLang(l) {
    if (!I18N[l] || l === lang) return;
    lang = l; ls.set("komu:lang", l);
    applyI18n();
    setAuthMode($("#authForm").dataset.mode, true);
    composers.forEach((c) => c.refreshPlaceholder());
    renderAll();
    if ($("#settingsModal").classList.contains("open") && state.me) { renderRequests(); render2fa(); renderPwBox(); }
    closePicker();
  }
  function setTheme(th) {
    document.documentElement.dataset.theme = th;
    ls.set("komu:theme", th);
    $$("[data-theme-btn]").forEach((b) => b.classList.toggle("on", b.dataset.themeBtn === th));
  }

  /* =================================================================
     Mídia dos posts
     ================================================================= */
  const mediaSrc = (url) => (url && url.startsWith("komu:") ? BUILTIN[url] || "" : url);
  function mediaHTML(media) {
    if (!Array.isArray(media) || !media.length) return "";
    const first = media[0];
    if (first.type === "sticker") return `<img class="sticker" src="${esc(mediaSrc(first.url))}" alt="" loading="lazy">`;
    if (first.type === "video") return `<video class="media-video" src="${esc(first.url)}" controls playsinline preload="metadata"></video>`;
    const imgs = media.filter((m) => m.type === "image" || m.type === "gif").slice(0, 4);
    return `<div class="media-grid n${imgs.length}">${imgs.map((m) => `<div class="${m.type === "gif" ? "media-gif" : ""}"><img src="${esc(m.url)}" alt="" loading="lazy" data-lightbox="${esc(m.url)}"></div>`).join("")}</div>`;
  }

  /* =================================================================
     Posts
     ================================================================= */
  function postHTML(p, opts = {}) {
    const ts = Date.parse(p.created_at);
    const liked = state.liked.has(p.id), reposted = state.reposted.has(p.id), saved = state.bookmarked.has(p.id);
    const article = `
      <article class="post ${opts.main ? "main" : ""}" data-id="${p.id}">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="clickable" data-user="${p.author_id}">${avatarHTML(p)}</div>
          ${opts.thread ? '<div class="thread-line"></div>' : ""}
        </div>
        <div class="post-body">
          <div class="post-meta">
            <span class="name clickable" data-user="${p.author_id}">${esc(p.name)}</span>
            ${p.is_private ? lockHTML() : ""}
            <span class="handle clickable" data-user="${p.author_id}">@${esc(p.username)}</span><span>·</span>
            <time datetime="${esc(p.created_at)}" title="${esc(new Date(ts).toLocaleString(locale()))}">${timeAgo(ts)}</time>
            ${opts.compact ? "" : `<button class="post-menu" data-action="menu" aria-label="${esc(t("more"))}">${ICONS.more}</button>`}
          </div>
          ${p.reply_to_username && !opts.compact ? `<div class="replying-to">${esc(t("replyingTo"))} <span class="mention" data-username="${esc(p.reply_to_username)}">@${esc(p.reply_to_username)}</span></div>` : ""}
          <div class="post-text">${richText(p.content || "")}</div>
          ${mediaHTML(p.media)}
          ${opts.compact ? "" : `
          <div class="actions">
            <button class="action reply" data-action="reply" aria-label="${esc(t("reply"))}" title="${esc(t("reply"))}"><span class="icon">${ICONS.reply}</span><span>${fmt(p.reply_count)}</span></button>
            <button class="action repost ${reposted ? "on" : ""}" data-action="repost" aria-label="${esc(t("repost"))}" title="${esc(t("repost"))}"><span class="icon">${ICONS.repost}</span><span>${fmt(p.repost_count)}</span></button>
            <button class="action like ${liked ? "on" : ""}" data-action="like" aria-label="${esc(t("like"))}" title="${esc(t("like"))}"><span class="icon">${ICONS.like}</span><span>${fmt(p.like_count)}</span></button>
            <button class="action bookmark ${saved ? "on" : ""}" data-action="bookmark" aria-label="${esc(t("bookmark"))}" title="${esc(t("bookmark"))}"><span class="icon">${ICONS.bookmark}</span></button>
            <button class="action share" data-action="share" aria-label="${esc(t("share"))}" title="${esc(t("share"))}"><span class="icon">${ICONS.link}</span></button>
          </div>`}
        </div>
      </article>`;
    if (opts.notif) {
      const icon = opts.notif === "reply" ? ICONS.reply : ICONS.at;
      return `<div class="post-wrap"><div class="notif-label">${icon} ${esc(t(opts.notif === "reply" ? "repliedYou" : "mentionedYou", { name: p.name }))}</div>${article}</div>`;
    }
    if (opts.repostBy) return `<div class="post-wrap"><div class="reposted-by">${ICONS.repost} ${esc(t("repostedBy", { name: opts.repostBy }))}</div>${article}</div>`;
    return article;
  }

  function emptyHTML(key, withLogin, icon) {
    return `<div class="empty">${icon ? `<div class="big-ico">${icon}</div>` : ""}<h2>${esc(t(key + "T"))}</h2><p>${esc(t(key + "D"))}</p>${withLogin ? `<button class="btn-primary" data-open-auth>${esc(t("login"))}</button>` : ""}</div>`;
  }
  const loadMoreHTML = () => (state.hasMore ? `<button class="load-more" id="loadMore">${esc(t(state.loading ? "loading" : "loadMore"))}</button>` : "");

  /* ---------------- Renderização principal ---------------- */
  function renderAll() {
    renderMe(); renderNav(); renderProfileHead(); renderTimeline();
    renderTrends(); renderFollow(); renderNewPosts(); renderBadges();
  }

  function renderTimeline() {
    const tl = $("#timeline");
    document.body.classList.toggle("in-thread", state.view === "messages" && !!state.dmWith);
    if (!sb) { tl.innerHTML = `<div class="setup"><h2>${esc(t("setupTitle"))}</h2><p class="muted">${esc(t("setupText"))}</p></div>`; return; }
    const v = state.view;
    if (v === "messages") return renderMessages();
    if (v === "post") return renderPostView();
    if (v === "profile") {
      if (state.profile === false) { tl.innerHTML = ""; return; }
      if (state.profile && !state.profile.canSee) {
        tl.innerHTML = `<div class="empty"><div class="big-ico">${ICONS.lock}</div><h2>${esc(t("privateTitle"))}</h2><p>${esc(t("privateText", { u: state.profile.u.username }))}</p></div>`;
        return;
      }
    }
    const needLogin = (["liked", "bookmarks", "notifications"].includes(v) || (v === "home" && state.tab === "following")) && !state.me;
    if (needLogin) { tl.innerHTML = emptyHTML("emptyLogin", true); return; }

    let top = "";
    if (v === "explore") {
      if (!state.query && state.trends && state.trends.length) {
        top = `<div class="section-title">${esc(t("trendsTitle"))}</div><div class="chips">${state.trends.map(([tag]) => `<button class="chip" data-search="${esc(tag)}">${esc(tag)}</button>`).join("")}</div>`;
      }
      if (state.query && state.people.length) {
        top += `<div class="section-title">${esc(t("people"))}</div>` + state.people.map((u) => `
          <div class="person">
            <div class="clickable" data-user="${u.id}">${avatarHTML(u)}</div>
            <div class="names clickable" data-user="${u.id}"><div style="font-weight:700">${esc(u.name)} ${u.is_private ? lockHTML() : ""}</div><div class="muted">@${esc(u.username)}</div></div>
            ${state.me && u.id === state.me.id ? "" : followBtnHTML(u.id)}
          </div>`).join("") + `<div class="section-title">${esc(t("postsTitle"))}</div>`;
      }
    }
    if (v === "notifications" && state.me && state.requests.length) {
      top = `<button class="req-banner" data-open-settings>${ICONS.lock} ${esc(state.requests.length === 1 ? t("requestsBanner1") : t("requestsBannerN", { n: state.requests.length }))}</button>`;
    }

    const posts = state.posts.filter((p) => !state.reported.has(p.id));
    const follows = v === "notifications" ? state.followNotifs : [];
    if (state.loading && !posts.length && !follows.length) { tl.innerHTML = top + '<div class="spinner"></div>'; return; }
    if (!posts.length && !follows.length) {
      const key = v === "home" ? (state.tab === "following" ? "emptyFollowing" : "emptyHome")
        : { explore: "emptyExplore", liked: "emptyLiked", bookmarks: "emptyBookmarks", profile: "emptyProfile", notifications: "emptyNotif" }[v];
      tl.innerHTML = top + emptyHTML(key);
      return;
    }
    if (v === "notifications") {
      const myName = state.me.username;
      const items = [
        ...posts.map((p) => ({ at: p.created_at, html: postHTML(p, { notif: p.reply_to_username === myName && !mentions(p.content, myName) ? "reply" : "mention" }) })),
        ...follows.map((f) => ({ at: f.created_at, html: followNotifHTML(f) })),
      ].sort((a, b) => (a.at < b.at ? 1 : -1));
      tl.innerHTML = top + items.map((i) => i.html).join("") + loadMoreHTML();
      return;
    }
    const prof = v === "profile" && state.profile ? state.profile.u : null;
    tl.innerHTML = top + posts.map((p) => postHTML(p, { repostBy: prof && p.author_id !== prof.id ? prof.name : null })).join("") + loadMoreHTML();
  }

  async function loadTimeline(more = false) {
    if (!sb) return renderTimeline();
    const v = state.view;
    if (v === "messages") return loadConversations();
    if (v === "post") return loadPostView();
    if (more && state.loading) return;
    const seq = more ? loadSeq : ++loadSeq;
    state.loading = true;
    if (!more) { state.posts = []; state.hasMore = false; }
    renderTimeline();
    try {
      let q = sb.from("feed").select("*").order("created_at", { ascending: false }).limit(PAGE);
      if (more && state.posts.length) q = q.lt("created_at", state.posts[state.posts.length - 1].created_at);
      let skip = false;

      if (v === "home") {
        q = q.is("reply_to", null);
        if (state.tab === "following") {
          // só quem você segue (sem os seus próprios posts)
          const ids = [...state.following].filter(([, s]) => s === "accepted").map(([id]) => id);
          if (!state.me || !ids.length) skip = true;
          else q = q.in("author_id", ids);
        }
      } else if (v === "explore") {
        const s = cleanQuery(state.query);
        if (s) {
          const term = s.replace(/^@/, "");
          q = q.or(`content.ilike.%${s}%,name.ilike.%${term}%,username.ilike.%${term}%`);
          if (!more) loadPeople(s);
        } else state.people = [];
      } else if (v === "liked" || v === "bookmarks") {
        const set = v === "liked" ? state.liked : state.bookmarked;
        if (!state.me || !set.size) skip = true;
        else q = q.in("id", [...set].slice(0, 300));
      } else if (v === "notifications") {
        if (!state.me) skip = true;
        else { q = notifQuery(q); if (!more) await loadFollowNotifs(); }
      } else if (v === "profile") {
        if (!state.profile || !state.profile.canSee) skip = true;
        else {
          const ids = state.profileReposts;
          q = ids.length ? q.or(`author_id.eq.${state.profileId},id.in.(${ids.join(",")})`) : q.eq("author_id", state.profileId);
        }
      }

      if (!skip) {
        const { data, error } = await q;
        if (error) throw error;
        if (seq !== loadSeq) return;
        const rows = v === "notifications" ? data.filter(isNotifFor) : data;
        state.posts = more ? state.posts.concat(rows) : rows;
        state.hasMore = data.length === PAGE;
      }
    } catch (e) {
      console.error(e);
      if (seq === loadSeq) toast(errMsg(t("loadError"), e));
    } finally {
      if (seq === loadSeq) { state.loading = false; renderTimeline(); }
    }
  }

  async function loadPeople(s) {
    const term = s.replace(/^@/, "");
    const { data } = await sb.from("profiles").select("id,username,name,color,avatar_url,is_private")
      .or(`username.ilike.%${term}%,name.ilike.%${term}%`).limit(5);
    if (cleanQuery(state.query) !== s || state.view !== "explore") return;
    state.people = data || [];
    renderTimeline();
  }

  /* ---------------- Post aberto + respostas (comentários) ---------------- */
  async function loadPostView() {
    const id = state.postId;
    state.postView = null; renderTimeline();
    try {
      const { data: main, error } = await sb.from("feed").select("*").eq("id", id).maybeSingle();
      if (error) throw error;
      if (id !== state.postId) return;
      if (!main) { state.postView = false; return renderTimeline(); }
      const [parentRes, repliesRes] = await Promise.all([
        main.reply_to ? sb.from("feed").select("*").eq("id", main.reply_to).maybeSingle() : Promise.resolve({ data: null }),
        sb.from("feed").select("*").eq("reply_to", id).order("created_at", { ascending: true }).limit(200),
      ]);
      if (id !== state.postId) return;
      state.postView = { parent: parentRes.data || null, main, replies: repliesRes.data || [] };
      state.posts = [state.postView.parent, main, ...state.postView.replies].filter(Boolean);
    } catch (e) {
      console.error(e); state.postView = false; toast(errMsg(t("loadError"), e));
    }
    renderTimeline();
  }
  function renderPostView() {
    const tl = $("#timeline");
    const P = state.postView;
    if (P === null) { tl.innerHTML = '<div class="spinner"></div>'; return; }
    if (P === false) { tl.innerHTML = `<div class="empty"><p>${esc(t("postNotFound"))}</p></div>`; return; }
    const replies = P.replies.filter((p) => !state.reported.has(p.id));
    tl.innerHTML =
      (P.parent ? postHTML(P.parent, { thread: true }) : "") +
      postHTML(P.main, { main: true }) +
      (state.me ? `<button class="reply-prompt" data-action-reply="${P.main.id}">${avatarHTML(state.me)}<span>${esc(t("replyPh"))}</span><span class="btn-primary">${esc(t("reply"))}</span></button>` : "") +
      (replies.length ? replies.map((p) => postHTML(p)).join("") : `<p class="muted" style="padding:20px 16px">${esc(t("noReplies"))}</p>`);
  }

  /* ---------------- Assuntos e sugestões ---------------- */
  async function loadTrends() {
    if (!sb) return;
    const { data } = await sb.from("posts").select("content").order("created_at", { ascending: false }).limit(300);
    const counts = {};
    (data || []).forEach((p) => ((p.content || "").match(/#[\wÀ-ÿ]+/g) || []).forEach((tag) => {
      const k = tag.toLowerCase(); counts[k] = (counts[k] || 0) + 1;
    }));
    state.trends = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
    renderTrends();
    if (state.view === "explore" && !state.query) renderTimeline();
  }
  function renderTrends() {
    if (!state.trends) { $("#trends").innerHTML = sb ? '<div class="spinner sm"></div>' : ""; return; }
    $("#trends").innerHTML = state.trends.length
      ? state.trends.slice(0, 5).map(([tag, n], i) => `<button class="trend" data-search="${esc(tag)}"><small>${esc(t("trendLabel", { i: i + 1 }))}</small><b>${esc(tag)}</b><small>${esc(n === 1 ? t("posts1") : t("postsN", { n }))}</small></button>`).join("")
      : `<p class="muted" style="padding:0 16px 16px">${esc(t("noTrends"))}</p>`;
  }
  async function loadWhoToFollow() {
    if (!sb) return;
    let q = sb.from("profiles").select("id,username,name,color,avatar_url,is_private").order("created_at", { ascending: false }).limit(15);
    if (state.me) q = q.neq("id", state.me.id);
    const { data } = await q;
    state.suggestions = (data || []).filter((u) => !state.following.has(u.id)).slice(0, 4);
    renderFollow();
  }
  function followBtnHTML(id) {
    const s = state.following.get(id);
    return `<button class="btn-follow ${s ? "following" : ""}" data-follow="${id}">${esc(t(s === "accepted" ? "followingBtn" : s === "pending" ? "requestedBtn" : "followBtn"))}</button>`;
  }
  function renderFollow() {
    const list = state.suggestions;
    if (!list) { $("#whoToFollow").innerHTML = sb ? '<div class="spinner sm"></div>' : ""; return; }
    $("#whoToFollow").innerHTML = list.length ? list.map((u) => `
      <div class="follow">
        <div class="clickable" data-user="${u.id}">${avatarHTML(u)}</div>
        <div class="names clickable" data-user="${u.id}"><div style="font-weight:700">${esc(u.name)} ${u.is_private ? lockHTML() : ""}</div><div class="muted">@${esc(u.username)}</div></div>
        ${followBtnHTML(u.id)}
      </div>`).join("") : `<p class="muted" style="padding:0 16px 16px">${esc(t("noSuggestions"))}</p>`;
  }

  /* =================================================================
     Perfil
     ================================================================= */
  async function loadProfile() {
    const id = state.profileId;
    const [prof, followers, following] = await Promise.all([
      sb.from("profiles").select("*").eq("id", id).maybeSingle(),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("following_id", id).eq("status", "accepted"),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", id).eq("status", "accepted"),
    ]);
    if (id !== state.profileId) return;
    const u = prof.data;
    if (!u) { state.profile = false; renderProfileHead(); return; }
    const isMe = !!state.me && state.me.id === id;
    const canSee = !u.is_private || isMe || state.following.get(id) === "accepted";
    state.profileReposts = [];
    if (canSee) {
      const reps = await sb.from("reposts").select("post_id").eq("user_id", id).order("created_at", { ascending: false }).limit(100);
      state.profileReposts = (reps.data || []).map((r) => r.post_id);
    }
    if (id !== state.profileId) return;
    state.profile = { u, followers: followers.count ?? 0, following: following.count ?? 0, canSee };
    renderProfileHead(); renderNav();
  }

  function renderProfileHead() {
    const head = $("#profileHead");
    if (state.view !== "profile") { head.innerHTML = ""; return; }
    const P = state.profile;
    if (P === null) { head.innerHTML = '<div class="spinner"></div>'; return; }
    if (P === false) { head.innerHTML = `<div class="empty"><h2>${esc(t("profileNotFound"))}</h2></div>`; return; }
    const u = P.u;
    const isMe = state.me && state.me.id === u.id;
    const cover = u.cover_url ? ` style="background-image:url('${esc(u.cover_url)}')"` : "";
    const actions = isMe
      ? `<button class="btn-outline" data-open-settings>${ICONS.gear} ${esc(t("editProfile"))}</button>`
      : `<button class="icon-round" data-dm="${u.id}" title="${esc(t("sendMessage"))}" aria-label="${esc(t("sendMessage"))}">${ICONS.mail}</button>${followBtnHTML(u.id)}`;
    head.innerHTML = `
      <div class="profile-head">
        <div class="profile-cover"${cover}></div>
        <div class="profile-info">
          <div class="profile-row">${avatarHTML(u)}<div class="profile-actions">${actions}</div></div>
          <h2>${esc(u.name)} ${u.is_private ? lockHTML() : ""}</h2>
          <div class="muted">@${esc(u.username)}</div>
          <div class="muted" style="margin-top:8px">${esc(t("joined", { date: new Date(u.created_at).toLocaleDateString(locale(), { month: "long", year: "numeric" }) }))}</div>
          <div class="profile-stats"><span><b>${P.following}</b> ${esc(t("followingCount"))}</span><span><b>${P.followers}</b> ${esc(t("followers"))}</span></div>
        </div>
      </div>`;
  }

  /* =================================================================
     Notificações
     ================================================================= */
  const mentions = (text, username) => !!username && new RegExp("(^|[^\\w])@" + username + "(?!\\w)", "i").test(text || "");
  function isNotifFor(p) {
    const u = state.me && state.me.username;
    return !!u && p.author_id !== state.me.id && (p.reply_to_username === u || mentions(p.content, u));
  }
  function notifQuery(q) {
    const u = state.me.username;
    return q.neq("author_id", state.me.id).or(`content.ilike.%@${u}%,reply_to_username.eq.${u}`);
  }
  const seenKey = () => "komu:notifSeen:" + (state.me ? state.me.id : "");
  async function fetchFollowers(since) {
    let q = sb.from("follows").select("follower_id,created_at,status").eq("following_id", state.me.id);
    if (since) q = q.gt("created_at", since);
    const r = await q.order("created_at", { ascending: false }).limit(50);
    return ((r && r.data) || []).filter((x) => !x.status || x.status === "accepted");
  }
  async function loadFollowNotifs() {
    if (!sb || !state.me) { state.followNotifs = []; return; }
    try {
      const rows = await fetchFollowers(null);
      const ids = rows.map((x) => x.follower_id);
      if (!ids.length) { state.followNotifs = []; return; }
      const { data } = await sb.from("profiles").select("id,username,name,color,avatar_url,is_private").in("id", ids);
      const byId = new Map((data || []).map((u) => [u.id, u]));
      state.followNotifs = rows.filter((x) => byId.has(x.follower_id)).map((x) => ({ created_at: x.created_at, user: byId.get(x.follower_id) }));
    } catch { state.followNotifs = []; }
  }
  function followNotifHTML(f) {
    const u = f.user, ts = Date.parse(f.created_at);
    return `<div class="notif-follow">
      <div class="nf-icon">${ICONS.userPlus}</div>
      <div class="nf-body">
        <div class="nf-top"><div class="clickable" data-user="${u.id}">${avatarHTML(u)}</div>${followBtnHTML(u.id)}</div>
        <div class="nf-text"><b class="clickable" data-user="${u.id}">${esc(u.name)}</b> <span class="muted">@${esc(u.username)} · <time datetime="${esc(f.created_at)}">${timeAgo(ts)}</time></span><br>${esc(t("followedYou", { name: u.name }))}</div>
      </div>
    </div>`;
  }
  async function loadNotifCount() {
    if (!sb || !state.me) { state.notifCount = 0; return renderBadges(); }
    const since = ls.get(seenKey()) || new Date(0).toISOString();
    try {
      const { data } = await notifQuery(sb.from("feed").select("id,author_id,content,reply_to_username,created_at"))
        .gt("created_at", since).order("created_at", { ascending: false }).limit(50);
      const newFollowers = await fetchFollowers(since);
      state.notifCount = (data || []).filter(isNotifFor).length + newFollowers.length;
    } catch { state.notifCount = 0; }
    renderBadges();
  }
  function renderBadges() {
    const n = state.me ? state.notifCount + state.requests.length : 0;
    $$("[data-notif-badge]").forEach((el) => { el.hidden = !n; el.textContent = n > 9 ? "9+" : n; });
    const d = state.me ? state.dmUnread : 0;
    $$("[data-dm-badge]").forEach((el) => { el.hidden = !d; el.textContent = d > 9 ? "9+" : d; });

  function markNotifsSeen() {

  /* =================================================================
     Mensagens privadas
     ================================================================= */
  async function loadDmUnread() {
    if (!sb || !state.me) { state.dmUnread = 0; return renderBadges(); }
    const { count } = await sb.from("messages").select("id", { count: "exact", head: true }).eq("recipient_id", state.me.id).is("read_at", null);
    state.dmUnread = count || 0;
    renderBadges();
  }
  async function loadConversations() {
    if (!state.me) return renderTimeline();
    if (state.dmWith) return openThread(state.dmWith);
    state.convos = null; renderTimeline();
    const me = state.me.id;
    const { data, error } = await sb.from("messages").select("*").or(`sender_id.eq.${me},recipient_id.eq.${me}`).order("created_at", { ascending: false }).limit(400);
    if (error) { console.error(error); state.convos = []; toast(errMsg(t("loadError"), error)); return renderTimeline(); }
    const map = new Map();
    for (const m of data || []) {
      const other = m.sender_id === me ? m.recipient_id : m.sender_id;
      if (!map.has(other)) map.set(other, { otherId: other, last: m, unread: 0 });
      if (m.recipient_id === me && !m.read_at) map.get(other).unread++;
    }
    const ids = [...map.keys()];
    if (ids.length) {
      const { data: profs } = await sb.from("profiles").select("id,username,name,color,avatar_url,is_private").in("id", ids);
      (profs || []).forEach((u) => (map.get(u.id).user = u));
    }
    state.convos = [...map.values()].filter((c) => c.user);
    state.dmUnread = state.convos.reduce((s, c) => s + c.unread, 0);
    renderBadges();
    if (state.view === "messages" && !state.dmWith) renderTimeline();
  }
  async function openThread(user) {
    state.dmWith = user; state.dmMessages = null;
    renderNav(); renderTimeline();
    const me = state.me.id, other = user.id;
    const { data, error } = await sb.from("messages").select("*").or(`sender_id.eq.${other},recipient_id.eq.${other}`).order("created_at", { ascending: true }).limit(300);
    if (state.dmWith !== user) return;
    if (error) { console.error(error); toast(errMsg(t("loadError"), error)); }
    state.dmMessages = (data || []).filter((m) => (m.sender_id === me && m.recipient_id === other) || (m.sender_id === other && m.recipient_id === me));
    renderTimeline();
    markThreadRead(other);
  }
  async function markThreadRead(other) {
    const unread = (state.dmMessages || []).filter((m) => m.recipient_id === state.me.id && !m.read_at);
    if (!unread.length) return;
    const now = new Date().toISOString();
    unread.forEach((m) => (m.read_at = now));
    await sb.from("messages").update({ read_at: now }).eq("recipient_id", state.me.id).eq("sender_id", other).is("read_at", null);
    loadDmUnread();
  }
  function renderMessages() {
    const tl = $("#timeline");
    if (!state.me) { tl.innerHTML = emptyHTML("emptyLogin", true); return; }
    if (!state.dmWith) {
      if (state.convos === null) { tl.innerHTML = '<div class="spinner"></div>'; return; }
      if (!state.convos.length) { tl.innerHTML = emptyHTML("emptyMsg", false, ICONS.mail); return; }
      tl.innerHTML = state.convos.map((c) => {
        const mine = c.last.sender_id === state.me.id;
        return `<button class="convo ${c.unread ? "unread" : ""}" data-convo="${c.user.id}">
          ${avatarHTML(c.user)}
          <div class="names">
            <div><b>${esc(c.user.name)}</b> <span class="muted">@${esc(c.user.username)} · ${timeAgo(Date.parse(c.last.created_at))}</span></div>
            <div class="last">${mine ? esc(t("you")) : ""}${esc(c.last.content)}</div>
          </div>
          ${c.unread ? '<span class="unread-dot"></span>' : ""}
        </button>`;
      }).join("");
      return;
    }
    const u = state.dmWith;
    const list = state.dmMessages;
    const draftText = ($("#dmText") || {}).value || "";
    const bubbles = list === null ? '<div class="spinner"></div>' : list.map((m, i) => {
      const mine = m.sender_id === state.me.id;
      const next = list[i + 1];
      const showTime = !next || next.sender_id !== m.sender_id || Date.parse(next.created_at) - Date.parse(m.created_at) > 5 * min;
      return `<div class="bubble ${mine ? "me" : ""}">${richText(m.content)}</div>${showTime ? `<div class="bubble-time ${mine ? "me" : ""}">${timeAgo(Date.parse(m.created_at))}</div>` : ""}`;
    }).join("");
    tl.innerHTML = `<div class="thread">
      <div class="thread-head clickable" data-user="${u.id}">${avatarHTML(u)}<b>${esc(u.name)}</b><span class="muted">@${esc(u.username)}</span></div>
      <div class="bubbles" id="bubbles">${bubbles}</div>
      <form class="dm-input" id="dmForm"><textarea id="dmText" rows="1" maxlength="1000" placeholder="${esc(t("msgPh"))}"></textarea><button class="btn-primary" type="submit">${esc(t("send"))}</button></form>
    </div>`;
    $("#dmText").value = draftText;
    window.scrollTo({ top: document.body.scrollHeight });
  }
  async function sendMessage(text) {
    const u = state.dmWith; if (!u || !text) return;
    const temp = { id: "tmp" + Date.now(), sender_id: state.me.id, recipient_id: u.id, content: text, created_at: new Date().toISOString() };
    state.dmMessages = (state.dmMessages || []).concat(temp);
    renderTimeline(); $("#dmText") && $("#dmText").focus();
    const { data, error } = await sb.from("messages").insert({ sender_id: state.me.id, recipient_id: u.id, content: text }).select().single();
    if (error) {
      console.error(error);
      state.dmMessages = state.dmMessages.filter((m) => m !== temp);
      renderTimeline();
      const ta = $("#dmText"); if (ta) ta.value = text;
      return toast(/row-level security/i.test(error.message || "") ? t("dmNotAllowed") : errMsg(t("dmError"), error));
    }
    Object.assign(temp, data);
  }
  function startDM(userId) {
    if (!requireAuth()) return;
    const known = (state.profile && state.profile.u.id === userId && state.profile.u)
      || (state.convos || []).map((c) => c.user).find((u) => u.id === userId);
    if (known) return go("messages", { dmWith: known });
    sb.from("profiles").select("id,username,name,color,avatar_url,is_private").eq("id", userId).maybeSingle()
      .then(({ data }) => data && go("messages", { dmWith: data }));
