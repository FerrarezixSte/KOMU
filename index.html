<style>
  /* Paleta: preto, vermelho e branco */
  :root {
    --bg: #ffffff;
    --bg-soft: #f4f4f4;
    --bg-hover: rgba(0, 0, 0, 0.04);
    --border: #e6e6e6;
    --text: #0a0a0a;
    --text-muted: #6b6b6b;
    --accent: #a20e0c;
    --accent-hover: #870b0a;
    --accent-soft: rgba(162, 14, 12, 0.1);
    --on-accent: #ffffff;
    --danger: #e10600;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --bg-soft: #141414;
    --bg-hover: rgba(255, 255, 255, 0.05);
    --border: #262626;
    --text: #ffffff;
    --text-muted: #8a8a8a;
    --accent: #e3261f;
    --accent-hover: #f0403a;
    --accent-soft: rgba(227, 38, 31, 0.16);
    --shadow: 0 8px 28px rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: 260px minmax(0, 600px) 340px; justify-content: center; min-height: 100vh; }

  /* ---------- Navegação lateral ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 8px 12px; gap: 4px; }
  .logo { display: flex; align-items: center; height: 60px; padding: 0 16px; margin-bottom: 4px; border-radius: 999px; color: var(--accent); width: fit-content; }
  .logo:hover { background: var(--accent-soft); }
  .logo .wordmark { width: 140px; }
  .logo .mark { display: none; width: 30px; height: 30px; }
  .mobile-mark { display: none; color: var(--accent); width: 28px; height: 28px; margin-left: auto; }
  .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 999px; font-size: 19px; width: fit-content; transition: background .15s; }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { font-weight: 700; }
  .nav-item.active svg { color: var(--accent); }
  .nav-item svg { width: 26px; height: 26px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 999px; padding: 0 20px; height: 40px; transition: background .15s, opacity .15s; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-outline { border: 1px solid var(--border); font-weight: 700; border-radius: 999px; padding: 0 18px; height: 36px; }
  .btn-outline:hover { background: var(--bg-hover); }
  .btn-post-big { width: 90%; height: 52px; font-size: 17px; margin-top: 12px; }
  .me-card { margin-top: auto; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 999px; text-align: left; }
  .me-card:hover { background: var(--bg-hover); }
  .me-card .names { min-width: 0; }
  .me-card .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Feed ---------- */
  .feed { border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; }
  .feed-header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .feed-header h1 { font-size: 20px; font-weight: 800; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
  .feed-header h1 .back { display: none; }
  .tabs { display: flex; }
  .tab { flex: 1; padding: 16px 0; color: var(--text-muted); font-weight: 500; position: relative; transition: background .15s; }
  .tab:hover { background: var(--bg-hover); }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 56px; height: 4px; border-radius: 4px; background: var(--accent); }

  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; user-select: none; background: #444; }
  button.avatar, .clickable { cursor: pointer; }

  .composer { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
  .composer-body { flex: 1; min-width: 0; }
  .composer textarea { width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 20px; line-height: 1.35; min-height: 56px; padding: 8px 0; }
  .composer textarea::placeholder { color: var(--text-muted); }
  .composer-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
  .composer-tools { display: flex; gap: 2px; color: var(--accent); }
  .composer-tools button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .composer-tools button:hover { background: var(--accent-soft); }
  .composer-actions { display: flex; align-items: center; gap: 12px; }
  .counter { position: relative; width: 26px; height: 26px; }
  .counter svg { width: 26px; height: 26px; transform: rotate(-90deg); stroke-width: 2.5; }
  .counter .track { stroke: var(--border); }
  .counter .bar { stroke: var(--text); transition: stroke-dashoffset .15s, stroke .15s; }
  .counter span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--text-muted); }
  .counter.warn .bar, .counter.over .bar { stroke: var(--accent); }
  .counter.over span { color: var(--accent); }
  .reply-context { font-size: 14px; color: var(--text-muted); padding-bottom: 4px; }
  .reply-context b { color: var(--accent); font-weight: 500; }

  .login-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border-bottom: 1px solid var(--border); }
  .login-cta p { color: var(--text-muted); }
  .login-cta strong { display: block; color: var(--text); font-size: 17px; }

  .new-posts { display: none; width: 100%; padding: 14px; color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--border); }
  .new-posts.show { display: block; }
  .new-posts:hover { background: var(--bg-hover); }

  /* ---------- Cabeçalho de perfil ---------- */
  .profile-head { border-bottom: 1px solid var(--border); }
  .profile-cover { height: 140px; background: linear-gradient(135deg, var(--accent), #000); }
  .profile-info { padding: 0 16px 16px; }
  .profile-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -44px; }
  .profile-row .avatar { width: 96px; height: 96px; font-size: 36px; border: 4px solid var(--bg); }
  .profile-info h2 { font-size: 20px; font-weight: 800; margin-top: 10px; }
  .profile-stats { display: flex; gap: 20px; margin-top: 10px; color: var(--text-muted); }
  .profile-stats b { color: var(--text); }

  /* ---------- Posts ---------- */
  .post { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background .15s; animation: fadeIn .25s ease; }
  .post:hover { background: var(--bg-hover); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .post-body { flex: 1; min-width: 0; }
  .post-meta { display: flex; align-items: center; gap: 4px; color: var(--text-muted); white-space: nowrap; overflow: hidden; }
  .post-meta .name { color: var(--text); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .post-meta .name:hover { text-decoration: underline; }
  .post-meta .handle { overflow: hidden; text-overflow: ellipsis; }
  .post-menu { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text-muted); flex-shrink: 0; }
  .post-menu:hover { background: var(--accent-soft); color: var(--accent); }
  .post-wrap { border-bottom: 1px solid var(--border); padding-top: 8px; }
  .post-wrap .post { border-bottom: none; padding-top: 0; }
  .reposted-by { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 0 0 4px 44px; }
  .reposted-by svg { width: 15px; height: 15px; }
  .post-text { white-space: pre-wrap; word-wrap: break-word; margin: 2px 0 10px; }
  .post-text .tag, .post-text .mention { color: var(--accent); cursor: pointer; }
  .post-text a.link { color: var(--accent); text-decoration: none; }
  .post-text a.link:hover { text-decoration: underline; }
  .replying-to { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
  .replying-to b { color: var(--accent); font-weight: 400; }

  .actions { display: flex; justify-content: space-between; max-width: 425px; margin-left: -8px; }
  .action { display: flex; align-items: center; gap: 2px; color: var(--text-muted); font-size: 13px; }
  .action .icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
  .action svg { width: 18px; height: 18px; }
  .action:hover, .action.on { color: var(--accent); }
  .action:hover .icon { background: var(--accent-soft); }
  .action.like.on svg, .action.bookmark.on svg { fill: currentColor; }
  .action.repost.on svg { stroke-width: 2.6; }
  .action.like.pop svg { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.35); } }

  .empty { padding: 48px 32px; text-align: center; color: var(--text-muted); }
  .empty h2 { color: var(--text); font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .empty .btn-primary { margin-top: 20px; }
  .setup { padding: 32px 24px; line-height: 1.6; }
  .setup h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .setup code { background: var(--bg-soft); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .setup ol { padding-left: 20px; margin-top: 8px; color: var(--text-muted); }

  .spinner { width: 28px; height: 28px; margin: 32px auto; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-more { display: block; width: 100%; padding: 16px; color: var(--accent); font-weight: 600; }
  .load-more:hover { background: var(--bg-hover); }

  /* ---------- Coluna direita ---------- */
  .aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 6px 0 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .search { position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 2; }
  .search label { display: flex; align-items: center; gap: 12px; background: var(--bg-soft); border: 1px solid transparent; border-radius: 999px; padding: 0 16px; height: 44px; color: var(--text-muted); }
  .search label:focus-within { border-color: var(--accent); background: var(--bg); color: var(--accent); }
  .search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font: inherit; }
  .search input::placeholder { color: var(--text-muted); }
  .panel { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .panel h2 { font-size: 20px; font-weight: 800; padding: 12px 16px; }
  .trend { display: block; width: 100%; text-align: left; padding: 12px 16px; transition: background .15s; }
  .trend:hover, .follow:hover { background: var(--bg-hover); }
  .trend small { color: var(--text-muted); font-size: 13px; display: block; }
  .trend b { display: block; margin: 2px 0; }
  .follow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; transition: background .15s; }
  .follow .names { flex: 1; min-width: 0; text-align: left; }
  .follow .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-follow { background: var(--text); color: var(--bg); font-weight: 700; border-radius: 999px; padding: 0 16px; height: 32px; font-size: 14px; flex-shrink: 0; }
  .btn-follow.following { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-follow.following:hover { border-color: var(--accent); color: var(--accent); }
  .muted { color: var(--text-muted); }
  .footer-links { font-size: 13px; color: var(--text-muted); padding: 0 16px; line-height: 1.8; }

  /* ---------- Modais ---------- */
  .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(60, 60, 60, 0.5); display: none; align-items: flex-start; justify-content: center; padding: 5vh 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 600px; border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .modal-top { display: flex; align-items: center; padding: 8px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--bg-hover); }
  .modal .composer { border-bottom: none; padding-top: 4px; }
  .modal .quoted { padding: 0 16px; }
  .modal .quoted .post { padding: 4px 0 8px; border: none; }
  .modal .quoted .post:hover { background: none; }
  .thread-line { width: 2px; background: var(--border); margin: 4px auto 0; flex: 1; min-height: 16px; }
  .field { padding: 8px 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; outline: 1px solid var(--border); }
  .colors button.on { border-color: var(--bg); outline: 2px solid var(--text); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 16px 16px; }

  .auth-box { padding: 0 24px 16px; }
  .auth-box .wordmark { width: 150px; margin: 4px auto 16px; color: var(--accent); }
  .auth-box h2 { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 16px; }
  .auth-box .field { padding: 8px 0; }
  .auth-box .modal-footer { padding: 12px 0 0; }
  .auth-box .modal-footer .btn-primary { width: 100%; height: 48px; font-size: 16px; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .auth-tabs button { flex: 1; padding: 12px; color: var(--text-muted); font-weight: 600; position: relative; }
  .auth-tabs button.on { color: var(--text); }
  .auth-tabs button.on::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); }
  #authForm[data-mode="login"] .signup-only { display: none; }
  .form-msg { min-height: 20px; font-size: 14px; color: var(--text-muted); padding-top: 4px; }
  .form-msg.error { color: var(--accent); }

  .dropdown { position: fixed; z-index: 40; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-width: 200px; overflow: hidden; }
  .dropdown button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; font-weight: 700; text-align: left; }
  .dropdown button:hover { background: var(--bg-hover); }
  .dropdown .danger { color: var(--danger); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 8px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ---------- Responsivo ---------- */
  .bottom-nav, .fab, .mobile-avatar { display: none; }
  @media (max-width: 1260px) {
    .app { grid-template-columns: 88px minmax(0, 600px) 340px; }
    .nav-item span, .btn-post-big .label, .me-card .names { display: none; }
    .sidebar { align-items: center; }
    .logo { width: 52px; height: 52px; padding: 0; justify-content: center; }
    .logo .wordmark { display: none; }
    .logo .mark { display: block; }
    .nav-item { padding: 12px; }
    .btn-post-big { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; }
    .btn-post-big .ico { display: block !important; }
  }
  @media (max-width: 1020px) {
    .app { grid-template-columns: 88px minmax(0, 600px); }
    .aside { display: none; }
  }
  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
    .feed { border: none; padding-bottom: 64px; }
    .feed-header h1 { padding: 10px 16px; }
    .mobile-mark { display: block; }
    .mobile-avatar { display: grid; width: 32px; height: 32px; font-size: 13px; }
    .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--border); justify-content: space-around; height: 54px; }
    .bottom-nav button { flex: 1; display: grid; place-items: center; }
    .bottom-nav button.active { color: var(--accent); }
    .bottom-nav svg { width: 26px; height: 26px; }
    .fab { display: grid; place-items: center; position: fixed; right: 16px; bottom: 70px; z-index: 21; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); }
    .fab svg { width: 24px; height: 24px; }
    .composer textarea { font-size: 17px; }
    .modal-backdrop { padding: 0; }
    .modal { border-radius: 0; min-height: 100vh; max-width: none; }
    .profile-cover { height: 110px; }
  }
</style>
</head>
<body>


<div class="app">

    <button class="nav-item" data-go="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Explorar</span></button>

    <div class="panel"><h2>O que está acontecendo</h2><div id="trends"></div></div>
    <div class="panel"><h2>Quem seguir</h2><div id="whoToFollow"></div></div>
    <p class="footer-links">Hospedado no GitHub Pages · Dados no Supabase</p>
  </aside>
</div>

<nav class="bottom-nav" aria-label="Navegação mobile">
  <button data-go="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>

<button class="fab" data-open-compose aria-label="Postar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- Modal: novo post / resposta -->
<div class="modal-backdrop" id="composeModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Novo post">
    <div class="modal-top"><button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

        <textarea placeholder="O que está acontecendo?" rows="3" maxlength="400"></textarea>
        <div class="composer-footer">
          <div class="composer-tools">

            <button type="button" data-insert="@" aria-label="Mencionar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button>

<script>
/* =====================================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Supabase → Project Settings → API / API Keys)
   A chave pública (publishable / anon) pode ficar no site: quem protege
   os dados são as regras de segurança do arquivo supabase.sql.
   ===================================================================== */
const SUPABASE_URL = "https://dttrfghqgnxsamwakagu.supabase.co";   // ex.: https://abcdefgh.supabase.co
const SUPABASE_KEY = "sb_publishable_SdJhnrXFPNtRDe_lEcxy7w_osPmbKmq";    // ex.: sb_publishable_... ou eyJhbGci...

(() => {
  "use strict";

  const CONFIGURED = /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_KEY.startsWith("COLE_AQUI");
  const sb = CONFIGURED && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const MAX = 280;
  const PAGE = 30;
  const COLORS = ["#a20e0c", "#000000", "#7a0000", "#ff4d4d", "#3a3a3a", "#b30000", "#8a8a8a", "#ff8080"];

  const state = {
    session: null,
    me: null,
    liked: new Set(), reposted: new Set(), bookmarked: new Set(), following: new Set(),
    posts: [], hasMore: false, loading: false,
    view: "home", tab: "foryou", query: "",
    profileId: null, profileReposts: [],
    replyTo: null, pending: 0,
  };

  /* ---------------- Utilidades ---------------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (name = "?") => name.trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase() || "?";
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + " mi" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(".0", "") + " mil" : n ? String(n) : "";
  const cleanQuery = (s) => s.replace(/[,()%*\\"']/g, " ").trim();
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const min = 60e3, hour = 60 * min, day = 24 * hour;
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < min) return "agora";
    if (d < hour) return Math.floor(d / min) + " min";
    if (d < day) return Math.floor(d / hour) + " h";
    return new Date(ts).toLocaleDateString("pt-BR", { day: "numeric", month: "short" }).replace(".", "");
  }
  function richText(text) {
    return esc(text)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a class="link" href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|\s)(#[\wÀ-ÿ]+)/g, '$1<span class="tag" data-search="$2">$2</span>')
      .replace(/(^|\s)@(\w+)/g, '$1<span class="mention" data-username="$2">@$2</span>');
  }
  const avatarHTML = (u, extra = "") => `<div class="avatar ${extra}" style="background:${esc(u.color || "#444")}">${esc(initials(u.name))}</div>`;


  const ICONS = {
    reply: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    repost: '<svg viewBox="0 0 24 24"><path d="M7 7h11v6M18 13l-3-3M18 13l3-3M17 17H6v-6M6 11l-3 3M6 11l3 3"/></svg>',
    like: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>',
    more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
  };

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /* ---------------- Renderização de posts ---------------- */
  function postHTML(p, opts = {}) {
    const ts = Date.parse(p.created_at);
    const liked = state.liked.has(p.id), reposted = state.reposted.has(p.id), saved = state.bookmarked.has(p.id);
    const article = `
      <article class="post" data-id="${p.id}">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="clickable" data-user="${p.author_id}">${avatarHTML(p)}</div>
          ${opts.thread ? '<div class="thread-line"></div>' : ""}
        </div>
        <div class="post-body">
          <div class="post-meta">
            <span class="name clickable" data-user="${p.author_id}">${esc(p.name)}</span>
            <span class="handle">@${esc(p.username)}</span><span>·</span>
            <time datetime="${esc(p.created_at)}" title="${new Date(ts).toLocaleString("pt-BR")}">${timeAgo(ts)}</time>
            ${opts.compact ? "" : `<button class="post-menu" data-action="menu" aria-label="Mais opções">${ICONS.more}</button>`}
          </div>
          ${p.reply_to_username && !opts.compact ? `<div class="replying-to">Respondendo a <b>@${esc(p.reply_to_username)}</b></div>` : ""}
          <div class="post-text">${richText(p.content)}</div>
          ${opts.compact ? "" : `
          <div class="actions">
            <button class="action reply" data-action="reply" aria-label="Responder"><span class="icon">${ICONS.reply}</span><span>${fmt(p.reply_count)}</span></button>
            <button class="action repost ${reposted ? "on" : ""}" data-action="repost" aria-label="Repostar"><span class="icon">${ICONS.repost}</span><span>${fmt(p.repost_count)}</span></button>
            <button class="action like ${liked ? "on" : ""}" data-action="like" aria-label="Curtir"><span class="icon">${ICONS.like}</span><span>${fmt(p.like_count)}</span></button>
            <button class="action bookmark ${saved ? "on" : ""}" data-action="bookmark" aria-label="Salvar"><span class="icon">${ICONS.bookmark}</span></button>
            <button class="action share" data-action="share" aria-label="Compartilhar"><span class="icon">${ICONS.share}</span></button>
          </div>`}
        </div>
      </article>`;
    if (opts.repostBy) return `<div class="post-wrap"><div class="reposted-by">${ICONS.repost} ${esc(opts.repostBy)} repostou</div>${article}</div>`;
    return article;
  }

  const EMPTY = {
    home: ["Nada por aqui ainda", "Seja a primeira pessoa a postar!"],
    following: ["Siga alguém", "Posts de quem você segue aparecem aqui."],
    explore: ["Nada encontrado", "Tente buscar outro termo."],
    liked: ["Nenhuma curtida ainda", "Toque no coração de um post e ele aparece aqui."],
    bookmarks: ["Nada salvo ainda", "Salve posts para ler depois."],
    profile: ["Nenhum post ainda", "Quando houver posts, eles aparecem aqui."],
    login: ["Entre na sua conta", "Essa área é pessoal."],
  };

  function renderSetup() {
    $("#timeline").innerHTML = `
      <div class="setup">
        <h2>Falta conectar o banco de dados</h2>
        <p class="muted">Abra o <code>index.html</code> e preencha <code>SUPABASE_URL</code> e <code>SUPABASE_KEY</code> no começo do script. O passo a passo completo está no <code>README.md</code>.</p>
        <ol>
          <li>Crie um projeto grátis em supabase.com</li>
          <li>Rode o arquivo <code>supabase.sql</code> no SQL Editor</li>
          <li>Copie a URL e a chave pública do projeto para o <code>index.html</code></li>
        </ol>
      </div>`;
    $("#loginCta").hidden = true;
  }

  function renderTimeline() {
    const tl = $("#timeline");
    if (!sb) return renderSetup();
    if (state.loading && !state.posts.length) { tl.innerHTML = '<div class="spinner"></div>'; return; }
    if (!state.posts.length) {
      let key = state.view === "home" && state.tab === "following" ? "following" : state.view;
      if (["liked", "bookmarks"].includes(state.view) && !state.me) key = "login";
      if (state.view === "home" && state.tab === "following" && !state.me) key = "login";
      const [t, d] = EMPTY[key] || EMPTY.home;
      tl.innerHTML = `<div class="empty"><h2>${t}</h2><p>${d}</p>${key === "login" ? '<button class="btn-primary" data-open-auth>Entrar</button>' : ""}</div>`;
      return;
    }
    const profName = state.view === "profile" ? state.profileName : null;
    tl.innerHTML = state.posts.map((p) => postHTML(p, {
      repostBy: state.view === "profile" && p.author_id !== state.profileId ? profName : null,
    })).join("") + (state.hasMore ? `<button class="load-more" id="loadMore">${state.loading ? "Carregando..." : "Carregar mais"}</button>` : "");
  }

  /* ---------------- Carregar posts ---------------- */
  async function loadTimeline(more = false) {
    if (!sb || state.loading) return;
    state.loading = true;
    if (!more) { state.posts = []; state.hasMore = false; }
    renderTimeline();
    try {
      let q = sb.from("feed").select("*").order("created_at", { ascending: false }).limit(PAGE);
      if (more && state.posts.length) q = q.lt("created_at", state.posts[state.posts.length - 1].created_at);
      let skip = false;
      const v = state.view;

      if (v === "home") {
        q = q.is("reply_to", null);
        if (state.tab === "following") {
          if (!state.me) skip = true;
          else q = q.in("author_id", [state.me.id, ...state.following]);
        }
      } else if (v === "explore") {
        const s = cleanQuery(state.query);
        if (s) q = q.or(`content.ilike.%${s}%,name.ilike.%${s}%,username.ilike.%${s}%`);
      } else if (v === "liked" || v === "bookmarks") {
        const set = v === "liked" ? state.liked : state.bookmarked;
        if (!state.me || !set.size) skip = true;
        else q = q.in("id", [...set].slice(0, 300));
      } else if (v === "profile") {
        const ids = state.profileReposts;
        q = ids.length ? q.or(`author_id.eq.${state.profileId},id.in.(${ids.join(",")})`) : q.eq("author_id", state.profileId);
      }

      if (!skip) {
        const { data, error } = await q;
        if (error) throw error;
        state.posts = more ? state.posts.concat(data) : data;
        state.hasMore = data.length === PAGE;
      }
    } catch (e) {
      console.error(e);
      toast("Não foi possível carregar os posts");
    } finally {
      state.loading = false;
      renderTimeline();
    }
  }

  async function loadTrends() {
    if (!sb) return;
    const { data } = await sb.from("posts").select("content").order("created_at", { ascending: false }).limit(300);
    const counts = {};
    (data || []).forEach((p) => (p.content.match(/#[\wÀ-ÿ]+/g) || []).forEach((t) => {
      const k = t.toLowerCase(); counts[k] = (counts[k] || 0) + 1;
    }));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    $("#trends").innerHTML = top.length
      ? top.map(([tag, n], i) => `<button class="trend" data-search="${esc(tag)}"><small>${i + 1} · Assunto do momento</small><b>${esc(tag)}</b><small>${n} ${n === 1 ? "post" : "posts"}</small></button>`).join("")
      : `<p class="muted" style="padding:0 16px 16px">Use #hashtags nos posts para aparecerem aqui.</p>`;
  }

  async function loadWhoToFollow() {
    if (!sb) return;
    let q = sb.from("profiles").select("id,username,name,color").order("created_at", { ascending: false }).limit(12);
    if (state.me) q = q.neq("id", state.me.id);
    const { data } = await q;
    const list = (data || []).filter((u) => !state.following.has(u.id)).slice(0, 4);
    $("#whoToFollow").innerHTML = list.length ? list.map((u) => `
      <div class="follow">
        <div class="clickable" data-user="${u.id}">${avatarHTML(u)}</div>
        <div class="names clickable" data-user="${u.id}"><div style="font-weight:700">${esc(u.name)}</div><div class="muted">@${esc(u.username)}</div></div>
        <button class="btn-follow" data-follow="${u.id}">Seguir</button>
      </div>`).join("") : `<p class="muted" style="padding:0 16px 16px">Nenhuma sugestão por enquanto.</p>`;
  }

  /* ---------------- Perfil ---------------- */
  async function loadProfileHead() {
    const id = state.profileId;
    const head = $("#profileHead");
    head.innerHTML = '<div class="spinner"></div>';
    const [prof, followers, following, reps] = await Promise.all([
      sb.from("profiles").select("*").eq("id", id).maybeSingle(),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("following_id", id),
      sb.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", id),
      sb.from("reposts").select("post_id").eq("user_id", id).order("created_at", { ascending: false }).limit(100),
    ]);
    const u = prof.data;
    if (!u) { head.innerHTML = '<div class="empty"><h2>Perfil não encontrado</h2></div>'; return false; }
    state.profileName = u.name;
    state.profileReposts = (reps.data || []).map((r) => r.post_id);
    $("#viewTitle").textContent = u.name;
    const isMe = state.me && state.me.id === id;
    const isFollowing = state.following.has(id);
    head.innerHTML = `
      <div class="profile-head">
        <div class="profile-cover"></div>
        <div class="profile-info">
          <div class="profile-row">
            ${avatarHTML(u)}
            ${isMe ? '<button class="btn-outline" id="editProfile">Editar perfil</button>'
                   : `<button class="btn-follow ${isFollowing ? "following" : ""}" data-follow="${u.id}">${isFollowing ? "Seguindo" : "Seguir"}</button>`}
          </div>
          <h2>${esc(u.name)}</h2>
          <div class="muted">@${esc(u.username)}</div>
          <div class="muted" style="margin-top:8px">Entrou em ${new Date(u.created_at).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</div>
          <div class="profile-stats"><span><b>${following.count ?? 0}</b> Seguindo</span><span><b>${followers.count ?? 0}</b> Seguidores</span></div>
        </div>
      </div>`;
    return true;
  }

  /* ---------------- Navegação ---------------- */
  async function go(view, extra = {}) {
    if (view === "me") {
      if (!requireAuth()) return;
      view = "profile"; extra.profileId = state.me.id;
    }
    state.view = view;
    state.profileId = extra.profileId || null;
    if (view !== "explore") { state.query = ""; $("#searchInput").value = ""; }
    state.pending = 0; renderNewPosts();
    renderNav();
    window.scrollTo({ top: 0 });
    $("#profileHead").innerHTML = "";
    if (view === "profile") {
      state.posts = []; state.loading = true; renderTimeline(); state.loading = false;
      if (!(await loadProfileHead())) { $("#timeline").innerHTML = ""; return; }
    }
    loadTimeline();
  }

  function renderNav() {
    const titles = { home: "Início", explore: state.query ? `Busca: ${state.query}` : "Explorar", liked: "Curtidas", bookmarks: "Salvos", profile: state.profileName || "Perfil" };
    $("#viewTitle").textContent = titles[state.view];
    $("#tabs").style.display = state.view === "home" ? "flex" : "none";
    $("#backBtn").style.display = state.view === "profile" ? "grid" : "none";
    $("#mobileMe").style.display = state.view === "profile" ? "none" : "";
    const showComposer = state.view === "home";
    $("#inlineComposer").hidden = !(showComposer && state.me && sb);
    $("#loginCta").hidden = !(sb && !state.me && state.view === "home");
    const isMyProfile = state.view === "profile" && state.me && state.profileId === state.me.id;
    $$("[data-go]").forEach((el) => {
      const g = el.dataset.go;
      el.classList.toggle("active", g === state.view || (g === "me" && isMyProfile));
    });
    $$(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === state.tab));
  }

  function renderMe() {
    const m = state.me;
    $$("[data-me-avatar]").forEach((el) => { el.textContent = m ? initials(m.name) : "?"; el.style.background = m ? m.color : "#444"; });
    $$("[data-me-name]").forEach((el) => (el.textContent = m ? m.name : "Entrar"));
    $$("[data-me-handle]").forEach((el) => (el.textContent = m ? "@" + m.username : "ou criar conta"));
  }

  function renderNewPosts() {
    const b = $("#newPosts");
    b.classList.toggle("show", state.pending > 0 && state.view === "home");
    b.textContent = `Mostrar ${state.pending} ${state.pending === 1 ? "post novo" : "posts novos"}`;
  }

  /* ---------------- Autenticação ---------------- */
  function requireAuth() {
    if (!sb) { toast("Configure o Supabase primeiro (veja o README)"); return false; }
    if (!state.me) { openAuth(); return false; }
    return true;
  }

  async function loadMe(session) {
    state.session = session;
    if (!session) {
      state.me = null;
      state.liked.clear(); state.reposted.clear(); state.bookmarked.clear(); state.following.clear();
      return;
    }
    const uid = session.user.id;
    const [prof, l, r, b, f] = await Promise.all([
      sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
      sb.from("likes").select("post_id").eq("user_id", uid),
      sb.from("reposts").select("post_id").eq("user_id", uid),
      sb.from("bookmarks").select("post_id").eq("user_id", uid),
      sb.from("follows").select("following_id").eq("follower_id", uid),
    ]);
    state.me = prof.data || null;
    state.liked = new Set((l.data || []).map((x) => x.post_id));
    state.reposted = new Set((r.data || []).map((x) => x.post_id));
    state.bookmarked = new Set((b.data || []).map((x) => x.post_id));
    state.following = new Set((f.data || []).map((x) => x.following_id));
  }

  function setAuthMode(mode) {
    $("#authForm").dataset.mode = mode;
    $$("[data-auth]").forEach((b) => b.classList.toggle("on", b.dataset.auth === mode));
    $("#authTitle").textContent = mode === "login" ? "Entrar na KOMU" : "Criar sua conta";
    $("#authSubmit").textContent = mode === "login" ? "Entrar" : "Criar conta";
    $("#auPass").autocomplete = mode === "login" ? "current-password" : "new-password";
    authMsg("");
  }
  function authMsg(text, error = false) { const m = $("#authMsg"); m.textContent = text; m.classList.toggle("error", error); }
  function openAuth(mode = "login") {
    if (!sb) { toast("Configure o Supabase primeiro (veja o README)"); return; }
    setAuthMode(mode); openModal($("#authModal"));
    setTimeout(() => $("#auEmail").focus(), 30);
  }
  $$("[data-auth]").forEach((b) => b.addEventListener("click", () => setAuthMode(b.dataset.auth)));

  $("#authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mode = e.target.dataset.mode;
    const email = $("#auEmail").value.trim();
    const password = $("#auPass").value;
    const btn = $("#authSubmit");
    if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg("Digite um e-mail válido.", true);
    if (password.length < 6) return authMsg("A senha precisa ter pelo menos 6 caracteres.", true);
    btn.disabled = true;
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw new Error(/confirm/i.test(error.message) ? "Confirme seu e-mail antes de entrar." : "E-mail ou senha incorretos.");
        closeModal($("#authModal"));
        toast("Bem-vindo(a) de volta!");
      } else {
        const name = $("#auName").value.trim();
        const username = $("#auUser").value.trim().toLowerCase().replace(/^@/, "");
        if (!name) throw new Error("Digite seu nome.");
        if (!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error("O @ deve ter 3 a 20 letras, números ou _.");
        const { data: taken } = await sb.from("profiles").select("id").eq("username", username).maybeSingle();
        if (taken) throw new Error("Esse @ já está em uso.");
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { name, username, color }, emailRedirectTo: location.href.split("#")[0] },
        });
        if (error) throw new Error(/registered/i.test(error.message) ? "Esse e-mail já tem conta." : error.message);
        if (!data.session) {
          authMsg("Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.");
          setTimeout(() => setAuthMode("login"), 4000);
          return;
        }
        closeModal($("#authModal"));
        toast("Conta criada!");
      }
    } catch (err) {
      authMsg(err.message || "Algo deu errado.", true);
    } finally {
      btn.disabled = false;
    }
  });

  /* ---------------- Perfil: editar / sair ---------------- */
  function openProfileEdit() {
    if (!requireAuth()) return;
    $("#pfName").value = state.me.name;
    $("#pfMsg").textContent = "";
    const palette = COLORS.includes(state.me.color) ? COLORS : [state.me.color, ...COLORS];
    $("#pfColors").innerHTML = palette.map((c) => `<button type="button" data-color="${c}" style="background:${c}" class="${c === state.me.color ? "on" : ""}" aria-label="Cor ${c}"></button>`).join("");
    openModal($("#profileModal"));
  }
  $("#pfColors").addEventListener("click", (e) => {
    const b = e.target.closest("[data-color]"); if (!b) return;
    $$("#pfColors button").forEach((x) => x.classList.toggle("on", x === b));
  });
  $("#pfSave").addEventListener("click", async () => {
    const name = $("#pfName").value.trim();
    if (!name) { $("#pfMsg").textContent = "Digite um nome."; return; }
    const color = $("#pfColors .on")?.dataset.color || state.me.color;
    const { error } = await sb.from("profiles").update({ name, color }).eq("id", state.me.id);
    if (error) { $("#pfMsg").textContent = "Não foi possível salvar."; return; }
    Object.assign(state.me, { name, color });
    closeModal($("#profileModal"));
    renderMe(); toast("Perfil atualizado");
    if (state.view === "profile") go("profile", { profileId: state.profileId }); else loadTimeline();
  });
  $("#pfLogout").addEventListener("click", async () => {
    await sb.auth.signOut();
    closeModal($("#profileModal"));
    toast("Você saiu da conta");
  });

  /* ---------------- Composer ---------------- */
  function setupComposer(root, onSubmit) {
    const ta = $("textarea", root);
    const btn = $(".composer-actions .btn-primary", root);
    const counter = $(".counter", root), bar = $(".bar", counter), label = $("span", counter);
    const C = 62.83;
    let busy = false;
    function update() {
      ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
      const len = [...ta.value].length, left = MAX - len;
      bar.style.strokeDashoffset = C - Math.min(len / MAX, 1) * C;
      counter.classList.toggle("warn", left <= 20 && left >= 0);
      counter.classList.toggle("over", left < 0);
      label.textContent = left <= 20 ? left : "";
      counter.style.visibility = len ? "visible" : "hidden";
      btn.disabled = busy || !ta.value.trim() || left < 0;
    }
    ta.addEventListener("input", update);
    ta.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) btn.click(); });
    btn.addEventListener("click", async () => {
      const text = ta.value.trim();
      if (!text || [...text].length > MAX || busy) return;
      busy = true; update();
      const ok = await onSubmit(text);
      busy = false;
      if (ok) ta.value = "";
      update();
    });
    $$("[data-insert]", root).forEach((b) => b.addEventListener("click", () => {
      const ins = b.dataset.insert, pos = ta.selectionStart ?? ta.value.length, pre = ta.value.slice(0, pos);
      const piece = (ins !== "😊" && pre && !/\s$/.test(pre) ? " " : "") + ins;
      ta.value = pre + piece + ta.value.slice(pos);
      ta.focus(); ta.selectionStart = ta.selectionEnd = pos + piece.length; update();
    }));
    update();
    return { ta, update };
  }

  async function createPost(content, reply_to = null) {
    if (!requireAuth()) return false;
    const { error } = await sb.from("posts").insert({ content, reply_to, author_id: state.me.id });
    if (error) { console.error(error); toast("Não foi possível publicar"); return false; }
    toast(reply_to ? "Resposta enviada" : "Seu post foi publicado");
    loadTimeline(); loadTrends();
    return true;
  }

  const inline = setupComposer($("#inlineComposer"), (t) => createPost(t));
  const modal = setupComposer($("#modalComposer"), async (t) => {
    const ok = await createPost(t, state.replyTo);
    if (ok) closeModal($("#composeModal"));
    return ok;
  });

  /* ---------------- Modais ---------------- */
  function openModal(el) { el.classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeModal(el) { el.classList.remove("open"); document.body.style.overflow = ""; if (el.id === "composeModal") state.replyTo = null; }
  $$(".modal-backdrop").forEach((bd) => bd.addEventListener("click", (e) => { if (e.target === bd || e.target.closest("[data-close]")) closeModal(bd); }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $$(".modal-backdrop.open").forEach(closeModal); closeDropdown(); } });

  function openCompose(replyToId = null) {
    if (!requireAuth()) return;
    state.replyTo = replyToId;
    const parent = replyToId && state.posts.find((p) => p.id === replyToId);
    const ctx = $("#replyContext");
    if (parent) {
      $("#quoted").innerHTML = postHTML(parent, { compact: true, thread: true });
      ctx.hidden = false; ctx.innerHTML = `Respondendo a <b>@${esc(parent.username)}</b>`;
      modal.ta.placeholder = "Poste sua resposta";
      modal.ta.value = parent.author_id !== state.me.id ? `@${parent.username} ` : "";
    } else {
      $("#quoted").innerHTML = ""; ctx.hidden = true;
      modal.ta.placeholder = "O que está acontecendo?"; modal.ta.value = "";
    }
    modal.update();
    openModal($("#composeModal"));
    setTimeout(() => { modal.ta.focus(); modal.ta.selectionStart = modal.ta.value.length; }, 30);
  }

  /* ---------------- Menu de opções ---------------- */
  let dropdown = null;
  function closeDropdown() { dropdown?.remove(); dropdown = null; }
  function openMenu(btn, post) {
    closeDropdown();
    dropdown = document.createElement("div");
    dropdown.className = "dropdown";
    dropdown.innerHTML = (state.me && post.author_id === state.me.id ? `<button class="danger" data-m="delete">${ICONS.trash} Excluir</button>` : "") +
      `<button data-m="copy">${ICONS.copy} Copiar texto</button>`;
    document.body.appendChild(dropdown);
    const r = btn.getBoundingClientRect(), w = dropdown.offsetWidth;
    dropdown.style.top = Math.min(r.bottom + 4, innerHeight - dropdown.offsetHeight - 8) + "px";
    dropdown.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    dropdown.addEventListener("click", async (e) => {
      const m = e.target.closest("[data-m]")?.dataset.m;
      closeDropdown();
      if (m === "delete" && confirm("Excluir este post? As respostas também serão apagadas.")) {
        const { error } = await sb.from("posts").delete().eq("id", post.id);
        if (error) return toast("Não foi possível excluir");
        state.posts = state.posts.filter((p) => p.id !== post.id);
        renderTimeline(); loadTrends(); toast("Post excluído");
      }
      if (m === "copy") copy(post.content);
    });
  }
  document.addEventListener("click", (e) => { if (dropdown && !e.target.closest(".dropdown") && !e.target.closest("[data-action=menu]")) closeDropdown(); });
  addEventListener("scroll", closeDropdown, { passive: true });

  function copy(text) {
    (navigator.clipboard?.writeText(text) || Promise.reject())
      .then(() => toast("Copiado para a área de transferência"))
      .catch(() => toast("Não foi possível copiar"));
  }

  /* ---------------- Ações nos posts ---------------- */
  async function toggle(table, set, post, countField) {
    if (!requireAuth()) return null;
    const on = !set.has(post.id);
    on ? set.add(post.id) : set.delete(post.id);
    if (countField) post[countField] += on ? 1 : -1;
    const res = on
      ? await sb.from(table).insert({ post_id: post.id, user_id: state.me.id })
      : await sb.from(table).delete().eq("post_id", post.id).eq("user_id", state.me.id);
    if (res.error && res.error.code !== "23505") {
      on ? set.delete(post.id) : set.add(post.id);
      if (countField) post[countField] += on ? -1 : 1;
      toast("Algo deu errado, tente de novo");
      return null;
    }
    return on;
  }

  $("#timeline").addEventListener("click", async (e) => {
    const tag = e.target.closest("[data-search]");
    if (tag) return search(tag.dataset.search);
    const mention = e.target.closest("[data-username]");
    if (mention) {
      const { data } = await sb.from("profiles").select("id").eq("username", mention.dataset.username.toLowerCase()).maybeSingle();
      return data ? go("profile", { profileId: data.id }) : toast("Usuário não encontrado");
    }
    const userEl = e.target.closest("[data-user]");
    if (userEl) return go("profile", { profileId: userEl.dataset.user });
    if (e.target.id === "loadMore") return loadTimeline(true);

    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.closest(".post").dataset.id;
    const post = state.posts.find((p) => p.id === id);
    if (!post) return;
    const act = btn.dataset.action;

    if (act === "like" || act === "repost") {
      const cfg = act === "like" ? ["likes", state.liked, "like_count"] : ["reposts", state.reposted, "repost_count"];
      // atualização otimista
      if (!state.me) return requireAuth();
      const willBeOn = !cfg[1].has(id);
      btn.classList.toggle("on", willBeOn);
      btn.lastElementChild.textContent = fmt(post[cfg[2]] + (willBeOn ? 1 : -1));
      if (act === "like") { btn.classList.remove("pop"); void btn.offsetWidth; if (willBeOn) btn.classList.add("pop"); }
      const result = await toggle(cfg[0], cfg[1], post, cfg[2]);
      if (result === null) { btn.classList.toggle("on", cfg[1].has(id)); btn.lastElementChild.textContent = fmt(post[cfg[2]]); }
      else if (act === "repost") toast(result ? "Repostado" : "Repost desfeito");
      if (act === "like" && state.view === "liked" && result === false) { state.posts = state.posts.filter((p) => p.id !== id); renderTimeline(); }
    } else if (act === "bookmark") {
      if (!state.me) return requireAuth();
      const result = await toggle("bookmarks", state.bookmarked, post);
      if (result === null) return;
      btn.classList.toggle("on", result);
      toast(result ? "Salvo" : "Removido dos salvos");
      if (state.view === "bookmarks" && !result) { state.posts = state.posts.filter((p) => p.id !== id); renderTimeline(); }
    } else if (act === "reply") {
      openCompose(id);
    } else if (act === "share") {
      copy(`${post.content}\n— @${post.username} na KOMU\n${location.href.split("#")[0]}`);
    } else if (act === "menu") {
      e.stopPropagation(); openMenu(btn, post);
    }
  });

  /* ---------------- Seguir ---------------- */
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-follow]");
    if (!b) return;
    if (!requireAuth()) return;
    const id = b.dataset.follow;
    const on = !state.following.has(id);
    b.disabled = true;
    const res = on
      ? await sb.from("follows").insert({ follower_id: state.me.id, following_id: id })
      : await sb.from("follows").delete().eq("follower_id", state.me.id).eq("following_id", id);
    b.disabled = false;
    if (res.error && res.error.code !== "23505") return toast("Algo deu errado");
    on ? state.following.add(id) : state.following.delete(id);
    b.classList.toggle("following", on);
    b.textContent = on ? "Seguindo" : "Seguir";
    if (state.view === "profile" && state.profileId === id) loadProfileHead();
    if (state.view === "home" && state.tab === "following") loadTimeline();
  });

  /* ---------------- Busca e assuntos ---------------- */
  function search(term) {
    state.query = term; $("#searchInput").value = term;
    go("explore");
  }
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value;
      if (state.view !== "explore") { state.view = "explore"; $("#profileHead").innerHTML = ""; }
      renderNav(); loadTimeline();
    }, 300);
  });
  $("#trends").addEventListener("click", (e) => { const t = e.target.closest("[data-search]"); if (t) search(t.dataset.search); });
  $("#whoToFollow").addEventListener("click", (e) => { const u = e.target.closest("[data-user]"); if (u) go("profile", { profileId: u.dataset.user }); });

  /* ---------------- Eventos gerais ---------------- */
  $$("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
  $$("[data-tab]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderNav(); loadTimeline(); }));
  $$("[data-open-compose]").forEach((b) => b.addEventListener("click", () => openCompose()));
  document.addEventListener("click", (e) => { if (e.target.closest("[data-open-auth]")) openAuth(); });
  document.addEventListener("click", (e) => { if (e.target.closest("#editProfile")) openProfileEdit(); });
  $("#meCard").addEventListener("click", () => (state.me ? openProfileEdit() : openAuth()));
  $("#mobileMe").addEventListener("click", () => (state.me ? openProfileEdit() : openAuth()));
  $("#backBtn").addEventListener("click", () => go("home"));
  $("#newPosts").addEventListener("click", () => { state.pending = 0; renderNewPosts(); window.scrollTo({ top: 0 }); loadTimeline(); });

  /* ---------------- Tema (padrão: preto) ---------------- */
  const savedTheme = ls.get("piu:theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
  $("#themeToggle").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    ls.set("piu:theme", next);
  });

  setInterval(() => $$("#timeline time").forEach((el) => (el.textContent = timeAgo(Date.parse(el.getAttribute("datetime"))))), 60000);

  /* ---------------- Início ---------------- */
  async function init() {
    renderNav();
    if (!sb) { renderSetup(); $("#trends").innerHTML = ""; $("#whoToFollow").innerHTML = ""; return; }

    const { data } = await sb.auth.getSession();
    await loadMe(data.session);
    renderMe(); renderNav();
    loadTimeline(); loadTrends(); loadWhoToFollow();

    let lastUser = data.session?.user.id || null;
    sb.auth.onAuthStateChange((_event, session) => {
      const uid = session?.user.id || null;
      if (uid === lastUser) return;
      lastUser = uid;
      // adia para fora do callback (recomendação do Supabase)
      setTimeout(async () => {
        await loadMe(session);
        renderMe();
        if (state.view === "profile" || state.view === "liked" || state.view === "bookmarks") go(session ? state.view === "profile" ? "me" : state.view : "home");
        else { renderNav(); loadTimeline(); }
        loadWhoToFollow();
      }, 0);
    });

    // Tempo real: avisa quando outras pessoas postam
    sb.channel("novos-posts")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, (payload) => {
        if (state.me && payload.new.author_id === state.me.id) return;
        if (payload.new.reply_to) return;
        state.pending++; renderNewPosts();
      })
      .subscribe();
  }
  init();
})();
</script>
</body>
</html>
